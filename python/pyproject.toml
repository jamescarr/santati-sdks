[project]
name = "santati"
version = "0.1.0"
description = "Official Python SDK for the Santati audit-log API: emit audit events (one or a batch) and list or iterate over them."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["santati", "audit", "audit-log", "events", "logging"]
dependencies = [
    "urllib3>=2.1.0,<3",
    "python-dateutil>=2.8.2",
    "pydantic>=2.11",
    "typing-extensions>=4.7.1",
]

[project.optional-dependencies]
django = ["Django>=5.2"]
langchain = ["langchain-core>=1.2"]
openai-agents = ["openai-agents>=0.22.3", "anyio>=4"]
pydantic-ai = ["pydantic-ai-slim>=2.52", "anyio>=4"]
claude-agent-sdk = ["claude-agent-sdk>=0.1.46", "anyio>=4"]

[project.urls]
Repository = "https://github.com/jamescarr/santati-sdks"
Homepage = "https://github.com/jamescarr/santati-sdks/tree/main/python"
Issues = "https://github.com/jamescarr/santati-sdks/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "mypy>=1.13",
  "ruff>=0.8",
  "Django>=5.2",
  "django-stubs>=5.2",
  "langchain-core>=1.2",
  "openai-agents>=0.22.3",
  "pydantic-ai-slim>=2.52",
  "claude-agent-sdk>=0.1.46",
  "anyio>=4",
  "langgraph>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/santati", "src/santati_core"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["src/santati_core"]

[tool.mypy]
strict = true
files = ["src/santati"]

[[tool.mypy.overrides]]
module = ["santati_core", "santati_core.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
