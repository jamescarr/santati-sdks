name: Release (Terraform)

# Tag-driven release for terraform/ (`jamescarr/santati` on the Terraform
# Registry). Tagged by `mise run release:tag terraform`, so terraform-v0.1.0.
#
# The Terraform Registry only ingests a repository named
# terraform-provider-<type>, with GoReleaser's signed, zipped builds as release
# assets. This package is published through the read-only mirror
# jamescarr/terraform-provider-santati: publish = export terraform/ to the
# mirror, commit, tag vX.Y.Z, push, then run GoReleaser inside the clone so it
# builds and releases from the mirror's tag. The registry's webhook on the
# mirror does the rest. TERRAFORM_MIRROR_TOKEN (write access to the mirror),
# GPG_PRIVATE_KEY (an RSA key; the registry rejects ECC keys) and GPG_PASSPHRASE
# are repo secrets; see docs/releasing.md.

on:
  push:
    tags:
      - "terraform-v*"

concurrency:
  group: release-terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        env:
          PKG: terraform
        run: |
          source .mise/lib/pkg.sh
          [ "$(pkg_from_tag "$GITHUB_REF_NAME")" = "$PKG" ] || fail "$GITHUB_REF_NAME is not a $PKG tag"
          VERSION=$(pkg_version_from_tag "$GITHUB_REF_NAME")
          [ "$(pkg_version "$PKG")" = "$VERSION" ] ||
            fail "tag $VERSION != $PKG manifest $(pkg_version "$PKG")"
          pkg_has_heading "$PKG" "$VERSION" ||
            fail "$PKG/CHANGELOG.md has no '## [$VERSION]' heading"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: Run full test suite
    needs: resolve
    uses: ./.github/workflows/ci.yml

  publish:
    name: Mirror to terraform-provider-santati + GoReleaser + GitHub release
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    env:
      # The tools come from .mise.toml; a task run must not install the rest.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.11
          cache_key_prefix: mise-release-terraform
          install_args: go goreleaser

      - name: Import the signing key
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          source .mise/lib/pkg.sh
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          [ -n "$fpr" ] || fail "GPG_PRIVATE_KEY holds no secret key"
          # Sign a throwaway file now: a wrong key or passphrase must fail here,
          # before the export step pushes the release tag to the mirror.
          echo check > "$RUNNER_TEMP/gpg-check"
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$fpr" --output "$RUNNER_TEMP/gpg-check.sig" --detach-sign "$RUNNER_TEMP/gpg-check" ||
            fail "GPG_PASSPHRASE does not unlock the key in GPG_PRIVATE_KEY"
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"

      - name: Export terraform/ to the mirror
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          MIRROR_TOKEN: ${{ secrets.TERRAFORM_MIRROR_TOKEN }}
        run: |
          source .mise/lib/pkg.sh
          git clone "https://x-access-token:${MIRROR_TOKEN}@github.com/$TERRAFORM_MIRROR.git" "$RUNNER_TEMP/mirror"
          cd "$RUNNER_TEMP/mirror"
          subject="terraform-provider-santati $VERSION (santati-sdks $GITHUB_SHA)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            # A re-run after a later step failed: the export already happened.
            # Build from the tag it made, provided it came from this commit.
            git fetch --quiet origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            [ "$(git log -1 --format=%s "v$VERSION")" = "$subject" ] ||
              fail "the mirror's v$VERSION was not exported from $GITHUB_SHA"
            git checkout --quiet "v$VERSION"
          else
            git rm -rq --ignore-unmatch .
            git -C "$GITHUB_WORKSPACE" archive HEAD:terraform | tar -x -C .
            git add -A
            git -c user.name="santati-release" -c user.email="release@users.noreply.github.com" \
              commit -qm "$subject"
            git tag "v$VERSION"
            git push origin HEAD:main "v$VERSION"
          fi

      - name: Build, sign and release from the mirror
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.TERRAFORM_MIRROR_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          source .mise/lib/pkg.sh && pkg_notes terraform "$VERSION" > "$RUNNER_TEMP/notes.md"
          # The mirror has no .mise.toml: put mise's go and goreleaser on PATH
          # before leaving the workspace.
          eval "$(mise env -s bash)"
          cd "$RUNNER_TEMP/mirror"
          goreleaser release --clean --release-notes "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh && pkg_notes terraform "$VERSION" > "$RUNNER_TEMP/notes.md"
          # A re-run after this step already succeeded must not fail on it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
