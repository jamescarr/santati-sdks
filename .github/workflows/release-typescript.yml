name: Release (TypeScript)

# Tag-driven npm publish for typescript/ (`@santati/node`). Tagged by
# `mise run release:tag typescript`, so typescript-v0.1.0.
#
# `--provenance` needs the `id-token: write` permission and a public repo, and
# the npm organization `santati` must exist before the first publish (see
# docs/releasing.md).

on:
  push:
    tags:
      - "typescript-v*"

concurrency:
  group: release-typescript-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        env:
          PKG: typescript
        run: |
          source .mise/lib/pkg.sh
          [ "$(pkg_from_tag "$GITHUB_REF_NAME")" = "$PKG" ] || fail "$GITHUB_REF_NAME is not a $PKG tag"
          VERSION=$(pkg_version_from_tag "$GITHUB_REF_NAME")
          [ "$(pkg_version "$PKG")" = "$VERSION" ] ||
            fail "tag $VERSION != $PKG manifest $(pkg_version "$PKG")"
          pkg_has_heading "$PKG" "$VERSION" ||
            fail "$PKG/CHANGELOG.md has no '## [$VERSION]' heading"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: Run full test suite
    needs: resolve
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm + GitHub release
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: npm ci, build and publish
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm run build
          npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh && pkg_notes typescript "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
