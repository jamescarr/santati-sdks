name: Release (Rust)

# Tag-driven crates.io publish for rust/ (the `santati` crate). Tagged by
# `mise run release:tag rust`, so rust-v0.1.0.
#
# crates.io Trusted Publishing needs the crate to exist before a publisher can
# be registered for it, so the first publish carries CARGO_REGISTRY_TOKEN; see
# docs/releasing.md.

on:
  push:
    tags:
      - "rust-v*"

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        env:
          PKG: rust
        run: |
          source .mise/lib/pkg.sh
          [ "$(pkg_from_tag "$GITHUB_REF_NAME")" = "$PKG" ] || fail "$GITHUB_REF_NAME is not a $PKG tag"
          VERSION=$(pkg_version_from_tag "$GITHUB_REF_NAME")
          [ "$(pkg_version "$PKG")" = "$VERSION" ] ||
            fail "tag $VERSION != $PKG manifest $(pkg_version "$PKG")"
          pkg_has_heading "$PKG" "$VERSION" ||
            fail "$PKG/CHANGELOG.md has no '## [$VERSION]' heading"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: Run full test suite
    needs: resolve
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io + GitHub release
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.11
          cache_key_prefix: mise-release-rust
          install_args: rust

      - name: cargo publish
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh && pkg_notes rust "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
