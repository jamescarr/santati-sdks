name: Release (PHP)

# Tag-driven release for php/ (`santati/santati-php` on Packagist). Tagged by
# `mise run release:tag php`, so php-v0.1.0.
#
# Packagist only reads the root of a repository, so this package is published
# through the read-only mirror jamescarr/santati-php: publish = export php/ to
# the mirror, commit, tag vX.Y.Z and push. Packagist's GitHub webhook does the
# rest. The deploy key (write access to the mirror) is PHP_MIRROR_DEPLOY_KEY;
# see docs/releasing.md.

on:
  push:
    tags:
      - "php-v*"

concurrency:
  group: release-php-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        env:
          PKG: php
        run: |
          source .mise/lib/pkg.sh
          [ "$(pkg_from_tag "$GITHUB_REF_NAME")" = "$PKG" ] || fail "$GITHUB_REF_NAME is not a $PKG tag"
          VERSION=$(pkg_version_from_tag "$GITHUB_REF_NAME")
          [ "$(pkg_version "$PKG")" = "$VERSION" ] ||
            fail "tag $VERSION != $PKG manifest $(pkg_version "$PKG")"
          pkg_has_heading "$PKG" "$VERSION" ||
            fail "$PKG/CHANGELOG.md has no '## [$VERSION]' heading"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: Run full test suite
    needs: resolve
    uses: ./.github/workflows/ci.yml

  publish:
    name: Mirror to santati-php + GitHub release
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PHP_MIRROR_DEPLOY_KEY }}

      - name: Export php/ to the mirror
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh
          git clone "git@github.com:$PHP_MIRROR.git" "$RUNNER_TEMP/mirror"
          cd "$RUNNER_TEMP/mirror"
          git rm -rq --ignore-unmatch .
          git -C "$GITHUB_WORKSPACE" archive HEAD:php | tar -x -C .
          git add -A
          git -c user.name="santati-release" -c user.email="release@users.noreply.github.com" \
            commit -qm "santati-php $VERSION (santati-sdks $GITHUB_SHA)"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh && pkg_notes php "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
