name: Release (Go)

# Tag-driven release for go/. The module is a subdirectory of this repository,
# so the tag itself is the release: `go/v0.1.0`, pushed by
# `mise run release:tag go`. The only publish step is warming the module proxy
# so `go get github.com/jamescarr/santati-sdks/go` resolves immediately.

on:
  push:
    tags:
      - "go/v*"

concurrency:
  group: release-go-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        env:
          PKG: go
        run: |
          source .mise/lib/pkg.sh
          [ "$(pkg_from_tag "$GITHUB_REF_NAME")" = "$PKG" ] || fail "$GITHUB_REF_NAME is not a $PKG tag"
          VERSION=$(pkg_version_from_tag "$GITHUB_REF_NAME")
          [ "$(pkg_version "$PKG")" = "$VERSION" ] ||
            fail "tag $VERSION != $PKG manifest $(pkg_version "$PKG")"
          pkg_has_heading "$PKG" "$VERSION" ||
            fail "$PKG/CHANGELOG.md has no '## [$VERSION]' heading"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: Run full test suite
    needs: resolve
    uses: ./.github/workflows/ci.yml

  publish:
    name: Warm the module proxy + GitHub release
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Warm the Go module proxy
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          module=$(source .mise/lib/pkg.sh && sed -n 's/^module \(.*\)$/\1/p' go/go.mod)
          curl -fsS "https://proxy.golang.org/$module/@v/v$VERSION.info"
          echo

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh && pkg_notes go "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
