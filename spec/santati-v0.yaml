        Documentation-only on the write path — `apps.audit_trails.ingest` is the
        validator — and the shape `AuditEventSerializer.get_actor` always returns, so
        every key is present on a read even when the producer sent none of them.
      properties:
        type:
          type: string
          description: 'Actor kind: user, system, agent or anonymous. The relay path
            stores whatever Ankusa relayed.'
          maxLength: 64
        id:
          type: string
          description: The actor's id in the producer's own namespace; required unless
            `type` is anonymous.
          maxLength: 255
        name:
          type: string
          description: Human-readable actor name; empty when unknown.
          maxLength: 255
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          description: 'Actor metadata: at most 50 keys, each at most 40 characters
            of A-Z a-z 0-9 _ . -, each value at most 500 characters. An agent acting
            for someone sets on_behalf_of_type and on_behalf_of_id.'
      required:
      - type
    EventActorRequest:
      type: object
      description: |-
        Who acted, in the producer's own ids.

        Documentation-only on the write path — `apps.audit_trails.ingest` is the
        validator — and the shape `AuditEventSerializer.get_actor` always returns, so
        every key is present on a read even when the producer sent none of them.
      properties:
        type:
          type: string
          minLength: 1
          description: 'Actor kind: user, system, agent or anonymous. The relay path
            stores whatever Ankusa relayed.'
          maxLength: 64
        id:
          type: string
          minLength: 1
          description: The actor's id in the producer's own namespace; required unless
            `type` is anonymous.
          maxLength: 255
        name:
          type: string
          minLength: 1
          description: Human-readable actor name; empty when unknown.
          maxLength: 255
        metadata:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 500
          description: 'Actor metadata: at most 50 keys, each at most 40 characters
            of A-Z a-z 0-9 _ . -, each value at most 500 characters. An agent acting
            for someone sets on_behalf_of_type and on_behalf_of_id.'
      required:
      - type
    EventBatchAcceptedItem:
      type: object
      description: One item of a batch result that was indexed, or replayed from an
        earlier request.
      properties:
        index:
          type: integer
          description: Position of the event in the submitted `events` array, counting
            from 0.
        status:
          allOf:
          - $ref: '#/components/schemas/EventBatchAcceptedItemStatusEnum'
          description: |-
            accepted: written by this request. duplicate: an idempotency replay of an event already stored.

            * `accepted` - accepted
            * `duplicate` - duplicate
        id:
          type: string
          description: The stored event's id.
      required:
      - id
      - index
      - status
    EventBatchAcceptedItemStatusEnum:
      enum:
      - accepted
      - duplicate
      type: string
      description: |-
        * `accepted` - accepted
        * `duplicate` - duplicate
    EventBatchItemResult:
      oneOf:
      - $ref: '#/components/schemas/EventBatchAcceptedItem'
      - $ref: '#/components/schemas/EventBatchRejectedItem'
    EventBatchRejectedItem:
      type: object
      description: One item of a batch result that could not be indexed. The event
        was not stored.
      properties:
        index:
          type: integer
          description: Position of the event in the submitted `events` array, counting
            from 0.
        status:
          allOf:
          - $ref: '#/components/schemas/EventBatchRejectedItemStatusEnum'
          description: |-
            Always `rejected`; the reason is in `error`.

            * `rejected` - rejected
        error:
          allOf:
          - $ref: '#/components/schemas/ErrorBody'
          description: 'Why the event was rejected: a reserved code, a message and
            the field at fault.'
      required:
      - error
      - index
      - status
    EventBatchRejectedItemStatusEnum:
      enum:
      - rejected
      type: string
      description: '* `rejected` - rejected'
    EventBatchRequest:
      type: object
      description: |-
        Documentation-only shape of a batch ingest request: ``{"events": [...]}``.

        One request may carry at most `MAX_EVENTS_PER_BATCH` envelopes; the whole body
        is capped at 1 MiB.
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventEnvelopeRequest'
          description: One to 500 envelopes, indexed in order.
      required:
      - events
    EventBatchResult:
      type: object
      description: |-
        Documentation-only shape of a batch ingest response.

        Mirrors `apps.audit_trails.api_views._batch_response`: one entry per submitted
        event, in submission order, an accepted or duplicate entry carrying the stored
        event's id and a rejected entry carrying the error envelope instead. The
        response is 202 when nothing was rejected and 207 when anything was.
      properties:
        accepted:
          type: integer
          description: How many events this request indexed (including idempotent
            replays).
        rejected:
          type: integer
          description: How many events this request rejected.
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventBatchItemResult'
          readOnly: true
          description: One result per submitted event, in submission order.
      required:
      - accepted
      - rejected
      - results
    EventDefinition:
      type: object
      properties:
        action:
          type: string
          readOnly: true
          description: The action name, e.g. invoice.voided.
        description:
          type: string
          readOnly: true
          description: What this action means, for the people reading the catalog.
        allowed_target_types:
          type: array
          items:
            type: string
            maxLength: 64
          readOnly: true
          description: Target types an event with this action may name; empty means
            any target type.
        is_active:
          type: boolean
          readOnly: true
          description: True while the action is in force. A definition that is not
            active is treated as undefined when a team has any definitions at all.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the action was first defined.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the definition was last changed.
      required:
      - action
      - allowed_target_types
      - created_at
      - description
      - is_active
      - updated_at
    EventDefinitionWriteRequest:
      type: object
      description: The writable part of a definition, for create and (partially) for
        update.
      properties:
        action:
          type: string
          minLength: 1
          description: 'The action name, e.g. invoice.voided: dotted segments of letters,
            digits, ''-'' and ''_''. Sending a new value on an update renames the
            action; its schema versions go with it.'
          maxLength: 255
        description:
          type: string
          description: What this action means, for the people reading the catalog.
        allowed_target_types:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Target types an event with this action may name; empty means
            any target type.
        is_active:
          type: boolean
          description: True while the action is in force. A definition that is not
            active is treated as undefined when a team has any definitions at all.
      required:
      - action
    EventEnvelopeRequest:
      type: object
      description: |-
        Documentation-only shape of one producer envelope.

        Never used to validate: `apps.audit_trails.envelope.parse_envelope` is the
        single validator, because it also has to serve the relay path's lenient
        mode. This class exists so the OpenAPI schema and the generated client show
        producers what to send, in the envelope's field order.

        The published limits are enforced by ingest, not here: the three metadata maps
        (the event's, the actor's and each target's) hold at most 50 keys, keys are at
        most 40 characters of `A-Z a-z 0-9 _ . -`, values are at most 500 characters,
        and an event names at most 10 targets.
      properties:
        event:
          type: string
          minLength: 1
          description: The event type, e.g. invoice.voided.
          maxLength: 255
        trail:
          type: string
          minLength: 1
          description: The audit log trail to index this event on; the key must be
            scoped to it.
          maxLength: 64
        created_at:
          type: string
          format: date-time
          description: 'RFC 3339 with an offset: when the event happened. Defaults
            to receipt time; a timestamp without an offset is refused.'
        organization_id:
          type: string
          minLength: 1
          description: The end-customer organization this event belongs to.
          maxLength: 255
        idempotency_key:
          type: string
          minLength: 1
          description: 'Replay guard, per trail: a repeat of the same key within 24
            hours returns the event already stored instead of indexing a new one.'
          maxLength: 255
        actor:
          allOf:
          - $ref: '#/components/schemas/EventActorRequest'
          description: Who acted; omit it for an event with no actor.
        targets:
          type: array
          items:
            $ref: '#/components/schemas/EventTargetRequest'
          description: The objects the event acted on; at most 10.
        metadata:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 500
          description: 'Event metadata: at most 50 keys, each at most 40 characters
            of A-Z a-z 0-9 _ . -, each value at most 500 characters.'
        data:
          description: The producer's own payload for the event, stored verbatim and
            never interpreted.
        context:
          type: object
          additionalProperties: {}
          description: Extra producer context, stored verbatim; `context.actor` and
            `context.targets` are read as a fallback when the top-level members are
            absent.
      required:
      - event
      - trail
    EventIngestRequest:
      oneOf:
      - $ref: '#/components/schemas/EventEnvelopeRequest'
      - $ref: '#/components/schemas/EventBatchRequest'
    EventSchemaDocumentRequest:
      type: object
      description: 'A schema document: the body of a draft create or update, and of
        a dry run.'
      properties:
        schema:
          description: The whole JSON Schema 2020-12 document, as a JSON object. Every
            `$ref` must point inside it (`#...`).
      required:
      - schema
    EventSchemaVersion:
      type: object
      properties:
        version:
          type: integer
          readOnly: true
          description: The per-action version number; never reused, even after a draft
            is deleted.
        status:
          allOf:
          - $ref: '#/components/schemas/SchemaVersionStatusEnum'
          readOnly: true
          description: |-
            draft: editable, validates nothing. published: immutable, validates ingest. deprecated: a newer version superseded it; pinned producers are accepted until `deprecation_deadline`.

            * `draft` - Draft
            * `published` - Published
            * `deprecated` - Deprecated
        schema:
          readOnly: true
          description: The JSON Schema 2020-12 document. It validates the event's
            `metadata`, `actor.metadata` and each `targets[].metadata`; metadata values
            are always strings.
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the version was published; null for a draft.
        deprecated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When a newer version superseded this one; null until then.
        deprecation_deadline:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When a deprecated version stops accepting pinned traffic; null
            while it is not deprecated.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the draft was first created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the version last changed. The `ETag` tracks it.
      required:
      - created_at
      - deprecated_at
      - deprecation_deadline
      - published_at
      - schema
      - status
      - updated_at
      - version
    EventTarget:
