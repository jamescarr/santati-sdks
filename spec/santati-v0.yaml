          description: Missing, invalid or under-scoped API key.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                UnknownAction:
                  value:
                    detail: No EventDefinition matches the given query.
                  summary: Unknown action
                InvalidCursor:
                  value:
                    detail: Invalid cursor
                  summary: Invalid cursor
          description: The action is not defined for this team, or the cursor is not
            one this endpoint issued.
    post:
      operationId: schema_versions_create
      description: Store a document as a new draft at the next version number; numbers
        are never reused. A draft validates nothing until it is published. To change
        a published version, create a draft from its document with your edit applied.
        Requires the ``manage`` scope on a key that is not limited to named trails.
      summary: Create a draft schema version
      parameters:
      - in: path
        name: action
        schema:
          type: string
        description: The action name, e.g. invoice.voided.
        required: true
      tags:
      - event-definitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSchemaDocumentRequest'
            examples:
              ASchemaDocument:
                value:
                  schema:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    type: object
                    properties:
                      metadata:
                        type: object
                        properties:
                          invoice_number:
                            type: string
                          void_reason:
                            type: string
                          source:
                            type: string
                          reason:
                            type: string
                          request_id:
                            type: string
                        required:
                        - invoice_number
                        additionalProperties:
                          type: string
                      actor:
                        type: object
                        properties:
                          metadata:
                            type: object
                            properties:
                              on_behalf_of_type:
                                type: string
                              on_behalf_of_id:
                                type: string
                            dependentRequired:
                              on_behalf_of_type:
                              - on_behalf_of_id
                              on_behalf_of_id:
                              - on_behalf_of_type
                            additionalProperties:
                              type: string
                      targets:
                        type: array
                        items:
                          type: object
                          properties:
                            metadata:
                              type: object
                              additionalProperties:
                                type: string
                summary: A schema document
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventSchemaDocumentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventSchemaDocumentRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          headers:
            ETag:
              schema:
                type: string
              description: A validator for this version; it changes whenever the version
                does. Send it back as `If-Match`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSchemaVersion'
              examples:
                DraftVersion:
                  value:
                    version: 2
                    status: draft
                    schema:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      type: object
                      properties:
                        metadata:
                          type: object
                          properties:
                            invoice_number:
                              type: string
                            void_reason:
                              type: string
                            source:
                              type: string
                            reason:
                              type: string
                            request_id:
                              type: string
                          required:
                          - invoice_number
                          additionalProperties:
                            type: string
                        actor:
                          type: object
                          properties:
                            metadata:
                              type: object
                              properties:
                                on_behalf_of_type:
                                  type: string
                                on_behalf_of_id:
                                  type: string
                              dependentRequired:
                                on_behalf_of_type:
                                - on_behalf_of_id
                                on_behalf_of_id:
                                - on_behalf_of_type
                              additionalProperties:
                                type: string
                        targets:
                          type: array
                          items:
                            type: object
                            properties:
                              metadata:
                                type: object
                                additionalProperties:
                                  type: string
                    published_at: null
                    deprecated_at: null
                    deprecation_deadline: null
                    created_at: '2026-09-29T14:03:11.482000Z'
                    updated_at: '2026-09-29T14:20:05.001000Z'
                  summary: Draft version
          description: The new draft.
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FieldErrors'
                - $ref: '#/components/schemas/ErrorDetail'
              examples:
                RemoteReferenceRefused:
                  value:
                    schema:
                    - Every $ref must point inside this document (#...); remote refs
                      are not allowed.
                  summary: Remote reference refused
                MalformedJSON:
                  value:
                    detail: 'JSON parse error - Expecting value: line 1 column 1 (char
                      0)'
                  summary: Malformed JSON
          description: 'The document was refused: it is not a JSON object, is too
            large, is not a valid JSON Schema 2020-12 document, has a remote `$ref`,
            or the body is not JSON.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: Missing, invalid or under-scoped API key.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                NotFound:
                  value:
                    detail: No EventDefinition matches the given query.
                  summary: Not found
          description: No EventDefinition has that id, or it belongs to another team.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                CreatedConcurrently:
                  value:
                    detail: That version was created concurrently. Save again.
                  summary: Created concurrently
          description: Another request created a version at the same moment; send
            the request again.
  /api/v0/event-definitions/{action}/schema-versions/{version}/:
    get:
      operationId: schema_versions_retrieve
      description: One version of an action's schema, with its status and an `ETag`.
