          items:
            $ref: '#/components/schemas/MatchRuleClause'
          description: Metadata clauses an event must satisfy; at most 20.
          maxItems: 20
    MatchRulesRequest:
      type: object
      description: |-
        The documented shape of ``match_rules``; ``{}`` forwards everything.

        Documentation only: ``matching.validate_rules`` validates the stored value,
        and every clause that is present must match for an event to be forwarded.
      properties:
        actions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Event actions to forward, as glob patterns; at most 50.
          maxItems: 50
        actor_types:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: 'Actor types to forward: user, system, agent or anonymous.'
        organization_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: External organization ids to forward; at most 50.
          maxItems: 50
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/MatchRuleClauseRequest'
          description: Metadata clauses an event must satisfy; at most 20.
          maxItems: 20
    OcsfMapping:
      type: object
      properties:
        version:
          type: string
          readOnly: true
          description: The OCSF release the mapping targets, e.g. 1.9.0.
        class_uid:
          type: integer
          readOnly: true
          description: The OCSF class the action maps to.
        activity_id:
          type: integer
          readOnly: true
          description: The class's activity_id enum value; 99 is Other, a best fit
            rather than exact.
        status_id:
          type: integer
          readOnly: true
          nullable: true
          description: 'The OCSF status_id the outcome sets: 2 for a failure, null
            when the action sets none.'
      required:
      - activity_id
      - class_uid
      - status_id
      - version
    OpEnum:
      enum:
      - eq
      - prefix
      - contains
      type: string
      description: |-
        * `eq` - eq
        * `prefix` - prefix
        * `contains` - contains
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Organization id.
        external_id:
          type: string
          readOnly: true
          description: The team's own identifier for this organization.
        name:
          type: string
          readOnly: true
          description: Display name of the organization; empty when the team has not
            set one.
        retention_months:
          type: integer
          readOnly: true
          description: How many months this organization's events are kept before
            purging.
        region:
          type: string
          readOnly: true
          description: Region this organization's events are stored in; empty when
            unset.
        legal_hold:
          type: boolean
          readOnly: true
          description: True while a legal hold suspends retention for this organization.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the organization was first created for this team.
      required:
      - created_at
      - external_id
      - id
      - legal_hold
      - name
      - region
      - retention_months
    PaginatedAuditEventList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: https://api.santati.io/api/v0/events/?cursor=cD00ODY%3D
          description: URL of the next page of results, or null on the last page.
        previous:
          type: string
          nullable: true
          format: uri
          example: https://api.santati.io/api/v0/events/?cursor=cj0xJnA9NDg3
          description: URL of the previous page of results, or null on the first page.
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    PaginatedEventDefinitionList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: https://api.santati.io/api/v0/event-definitions/?cursor=cD00ODY%3D
          description: URL of the next page of results, or null on the last page.
        previous:
          type: string
          nullable: true
          format: uri
          example: https://api.santati.io/api/v0/event-definitions/?cursor=cj0xJnA9NDg3
          description: URL of the previous page of results, or null on the first page.
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventDefinition'
    PaginatedEventSchemaVersionList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: https://api.santati.io/api/v0/event-definitions/invoice.voided/schema-versions/?cursor=cD00ODY%3D
          description: URL of the next page of results, or null on the last page.
        previous:
          type: string
          nullable: true
          format: uri
          example: https://api.santati.io/api/v0/event-definitions/invoice.voided/schema-versions/?cursor=cj0xJnA9NDg3
          description: URL of the previous page of results, or null on the first page.
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventSchemaVersion'
    PaginatedLogStreamList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: https://api.santati.io/api/v0/streams/?cursor=cD00ODY%3D
          description: URL of the next page of results, or null on the last page.
        previous:
          type: string
          nullable: true
          format: uri
          example: https://api.santati.io/api/v0/streams/?cursor=cj0xJnA9NDg3
          description: URL of the previous page of results, or null on the first page.
        results:
          type: array
          items:
            $ref: '#/components/schemas/LogStream'
    PaginatedOrganizationList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: https://api.santati.io/api/v0/organizations/?cursor=cD00ODY%3D
          description: URL of the next page of results, or null on the last page.
        previous:
          type: string
          nullable: true
          format: uri
          example: https://api.santati.io/api/v0/organizations/?cursor=cj0xJnA9NDg3
          description: URL of the previous page of results, or null on the first page.
        results:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
    PatchedEventDefinitionWriteRequest:
      type: object
      description: The writable part of a definition, for create and (partially) for
        update.
      properties:
        action:
          type: string
          minLength: 1
          description: 'The action name, e.g. invoice.voided: dotted segments of letters,
            digits, ''-'' and ''_''. Sending a new value on an update renames the
            action; its schema versions go with it.'
          maxLength: 255
        description:
          type: string
          description: What this action means, for the people reading the catalog.
        allowed_target_types:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Target types an event with this action may name; empty means
            any target type.
        is_active:
          type: boolean
          description: True while the action is in force. A definition that is not
            active is treated as undefined when a team has any definitions at all.
    PatchedLogStreamWriteRequest:
      type: object
      description: Create or edit a stream together with its destination, in one payload.
      properties:
        name:
          type: string
          minLength: 1
          description: Stream name, unique within the team.
          maxLength: 64
        trail:
          type: string
          minLength: 1
          description: Audit trail whose events this stream forwards; the trail must
            exist.
          maxLength: 64
        destination_type:
          allOf:
          - $ref: '#/components/schemas/DestinationTypeEnum'
          description: |-
            One of the registered destination types.

            * `https` - Webhook
        config:
          allOf:
          - $ref: '#/components/schemas/HttpsDestinationConfigRequest'
          writeOnly: true
          description: 'Destination settings: url, body format, extra headers and
            timeout. Omitted on an edit keeps the stored config.'
        auth:
          allOf:
          - $ref: '#/components/schemas/HttpsDestinationAuthRequest'
          writeOnly: true
          description: Credential header for the destination. Write-only; omitting
            it on an edit keeps the stored secret.
        match_rules:
          allOf:
          - $ref: '#/components/schemas/MatchRulesRequest'
          description: Which of the trail's events this stream forwards; {} forwards
            every event.
        status:
          allOf:
          - $ref: '#/components/schemas/StreamStateEnum'
          description: |-
            active forwards events, inactive pauses the stream; error and invalid are set by delivery, not by a caller.

            * `active` - Active
            * `inactive` - Inactive
            * `error` - Error
            * `invalid` - Invalid
    ReasonEnum:
      enum:
      - hash_mismatch
      - prev_hash_mismatch
      - seq_gap
      type: string
      description: |-
        * `hash_mismatch` - hash_mismatch
        * `prev_hash_mismatch` - prev_hash_mismatch
        * `seq_gap` - seq_gap
    SchemaCheck:
      type: object
      properties:
        checked:
          type: integer
          readOnly: true
          description: How many of the newest stored events were run.
        failed:
          type: integer
          readOnly: true
          description: How many of them the document would reject.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/SchemaCheckFailure'
          readOnly: true
          description: The first failing events, at most 50.
      required:
      - checked
      - failed
      - failures
    SchemaCheckFailure:
      type: object
      properties:
        event_id:
          type: string
          readOnly: true
          description: The stored event that fails the document.
        occurred_at:
          type: string
          format: date-time
          readOnly: true
          description: When the event occurred.
        field:
          type: string
          readOnly: true
          nullable: true
          description: The dotted path of the offending value, or null for the root.
        message:
          type: string
          readOnly: true
          description: What the document rejected.
      required:
      - event_id
      - field
      - message
      - occurred_at
    SchemaVersionStatusEnum:
      enum:
      - draft
      - published
      - deprecated
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `deprecated` - Deprecated
    SigningSecret:
      type: object
      description: |-
        Read shape of a stream's signing secret: the current one and the old one's expiry.

        Read-only, and returned by its own endpoint rather than by the stream read shape:
        a secret is a credential, so it is never echoed back by a list.
      properties:
        signing_secret:
          type: string
          readOnly: true
          description: Current Standard Webhooks signing secret, prefixed whsec_.
            Every outbound webhook this stream sends is signed with it; store it as
            a credential.
        previous_signing_secret_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the secret in use before the last rotation stops verifying.
            Null when no rotation has happened, or once the 24-hour overlap has elapsed.
      required:
      - previous_signing_secret_expires_at
      - signing_secret
    StandardEvent:
      type: object
      properties:
        action:
          type: string
          readOnly: true
          description: The action name, e.g. agent.tool.called.
        description:
          type: string
          readOnly: true
          description: What the action means.
        target_types:
          type: array
          items:
            type: string
          readOnly: true
          description: Target types installed as the action's allowed target types;
            empty means any.
        required_metadata:
          type: array
          items:
            type: string
          readOnly: true
          description: Metadata keys every event with this action must carry.
        optional_metadata:
          type: array
          items:
            type: string
          readOnly: true
          description: Metadata keys the schema declares as strings but does not require.
        schema:
          readOnly: true
          description: The JSON Schema 2020-12 document installed as the action's
            published v1.
        ocsf:
          allOf:
          - $ref: '#/components/schemas/OcsfMapping'
          readOnly: true
          description: The action's OCSF class and activity.
      required:
      - action
      - description
      - ocsf
      - optional_metadata
      - required_metadata
      - schema
      - target_types
    StandardEventCatalog:
      type: object
      properties:
        packs:
          type: array
          items:
            $ref: '#/components/schemas/StandardPack'
          readOnly: true
          description: Every standard pack.
      required:
      - packs
    StandardPack:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
          description: Stable identifier of the pack.
        name:
          type: string
          readOnly: true
          description: Display name of the pack.
        description:
          type: string
          readOnly: true
          description: What the pack covers.
        events:
          type: array
          items:
            $ref: '#/components/schemas/StandardEvent'
          readOnly: true
          description: The pack's actions.
      required:
      - description
      - events
      - name
      - slug
    StandardPackInstallRequest:
      type: object
      properties:
        packs:
          type: array
          items:
            $ref: '#/components/schemas/StandardPackSlugEnum'
          description: The slugs of the standard packs to install, as listed by the
            standard catalog.
      required:
      - packs
    StandardPackInstallResult:
      type: object
      properties:
        created:
          type: array
          items:
            type: string
          readOnly: true
          description: Actions defined now, each with a published v1.
        skipped:
          type: array
          items:
            type: string
          readOnly: true
          description: Actions the team already defined; they are left untouched.
      required:
      - created
      - skipped
    StandardPackSlugEnum:
      enum:
      - identity
      - organizations
      - access-control
      - credentials
      - configuration
      - enterprise-identity
      - privileged-access
      - agents
      - mcp
      type: string
      description: |-
        * `identity` - Authentication & sessions
        * `organizations` - Users & organizations
        * `access-control` - Roles & permissions
        * `credentials` - API keys, apps & secrets
        * `configuration` - Settings & security policy
        * `enterprise-identity` - SSO, directory sync & domains
        * `privileged-access` - Impersonation & support access
        * `agents` - AI agents
        * `mcp` - MCP servers
    StreamDestination:
      type: object
      description: Read shape for a destination. Never includes ``auth``.
      properties:
        name:
          type: string
          description: Name of the destination, which mirrors the stream's name.
          maxLength: 64
        destination_type:
          type: string
          description: Registered destination plugin, currently https.
          maxLength: 32
        config:
          allOf:
          - $ref: '#/components/schemas/HttpsDestinationConfig'
          description: 'Destination settings: url, body format, extra headers and
            timeout.'
      required:
      - config
      - destination_type
      - name
    StreamStateEnum:
      enum:
      - active
      - inactive
      - error
      - invalid
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `error` - Error
        * `invalid` - Invalid
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: '`Authorization: Api-Key <key>`. `/api/v0/` operations take a team
        API key; `/teams/` and `/a/{team_slug}/` operations take a user API key.'
servers:
- url: https://api.santati.io
  description: Production
- url: http://localhost:8000
  description: Local development
tags:
- name: audit-events
  x-displayName: Audit events
  description: Send audit events to a trail and search the events a team has recorded.
- name: audit-trails
  x-displayName: Audit trails
  description: Create, list and delete the trails that audit events are sent to.
- name: chain
  x-displayName: Chain verification
  description: Verify a trail's tamper-evident hash chain and download the verification
    report.
- name: event-definitions
  x-displayName: Event definitions
  description: The event actions defined in a team's schema catalog, their JSON Schema
    versions, and the standard packs that seed them.
- name: exports
  x-displayName: Exports
  description: Export matching audit events to a CSV or JSON Lines file.
- name: log-streams
  x-displayName: Log streams
  description: Forward a trail's audit events to an outbound webhook.
- name: organizations
  x-displayName: Organizations
  description: The end-customer organizations a team's events are recorded for.
