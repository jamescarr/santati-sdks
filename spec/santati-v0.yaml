        code:
          type: string
          description: 'Reserved failure code, one of: `invalid_envelope`, `unknown_field`,
            `invalid_actor_type`, `metadata_limit_exceeded`, `too_many_targets`, `unknown_action`,
            `schema_validation_failed`, `unknown_organization`, `quota_exceeded`,
            `rate_limited`, `trail_not_allowed`, `payload_too_large`. New codes are
            additive.'
        message:
          type: string
          description: Human-readable explanation of this particular failure.
        field:
          type: string
          nullable: true
          description: The request field at fault, or null when no single field is.
    ErrorDetail:
      type: object
      description: 'DRF''s default error body: one human-readable sentence, no field.'
      required:
      - detail
      properties:
        detail:
          type: string
          description: Why the request was refused.
    ErrorEnvelope:
      type: object
      description: 'The single error envelope of the ingestion surface: exactly one
