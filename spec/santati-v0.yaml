          type: string
          format: date-time
        description: RFC 3339, inclusive. Defaults to the trail's genesis.
      - in: query
        name: to
        schema:
          type: string
          format: date-time
        description: RFC 3339, exclusive. Defaults to the chain head.
      - in: query
        name: trail
