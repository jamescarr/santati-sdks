        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: Missing, invalid or under-scoped API key.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                CatalogChangedDuringTheInstall:
                  value:
                    detail: The catalog changed while adding packs. Nothing was added;
                      try again.
                  summary: Catalog changed during the install
          description: Another request changed the catalog during the install. Nothing
            was added.
