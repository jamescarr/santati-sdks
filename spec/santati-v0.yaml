        is the same for every team and any key scope reads it; install packs with
        `standard_events_install`. `schema` is the v1 document installed for each
        action: installing copies it into the team''s catalog, and the copy is the
        team''s own to edit like any custom schema. `ocsf` maps each action to an
        OCSF class and activity. Not paginated.'
