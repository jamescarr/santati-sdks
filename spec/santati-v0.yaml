      tags:
      - event-definitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardPackInstallRequest'
            examples:
              InstallTheAgentsPack:
                value:
                  packs:
                  - agents
                summary: Install the agents pack
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StandardPackInstallRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StandardPackInstallRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPackInstallResult'
              examples:
                PackInstalled:
                  value:
                    created:
                    - agent.tool.called
                    skipped:
                    - agent.created
                  summary: Pack installed
          description: Which actions were defined and which were already there.
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FieldErrors'
                - $ref: '#/components/schemas/ErrorDetail'
              examples:
                MalformedJSON:
                  value:
                    detail: 'JSON parse error - Expecting value: line 1 column 1 (char
