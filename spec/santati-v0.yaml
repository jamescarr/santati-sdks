  /api/v0/events/:
    get:
      operationId: events_list
      description: 'Audit events received on this tenant''s audit log trails, newest
        first. The list is cursor-paginated: follow ``next`` until it is ``null``.
        ``sort=relevance`` requires ``q`` and pages at most the first 10000 matches.'
      summary: List audit events
      parameters:
      - in: query
        name: actor_id
        schema:
          type: string
        description: Exact context.actor.id.
      - in: query
        name: actor_type
        schema:
          type: string
        description: 'One of: user, system, agent, anonymous.'
      - in: query
        name: created_after
        schema:
          type: string
        description: RFC 3339 instant or date, inclusive, on the producer's timestamp.
      - in: query
        name: created_before
        schema:
          type: string
        description: Same parsing, inclusive.
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from the previous page.
      - in: query
        name: event
        schema:
          type: string
        description: Exact event type, e.g. invoice.voided.
      - in: query
        name: event_prefix
        schema:
          type: string
        description: Events whose type starts with this literal prefix.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, up to 1000.
      - in: query
        name: metadata.<key>
        schema:
          type: string
        description: Repeatable. Matches events whose metadata contains this key/value
          pair.
      - in: query
        name: organization_id
        schema:
          type: string
        description: Producer's own organization id.
      - in: query
        name: q
        schema:
          type: string
        description: 'Full-text search over payload and metadata: at least one letter
          or digit, at most 200 characters, terms are ANDed prefixes. Relevance paging
          stops at the first 10000 matches.'
      - in: query
        name: sort
        schema:
