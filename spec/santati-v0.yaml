        return the first break, if any. A broken chain is a successful verification:
        branch on `status`, not on the HTTP code. The response carries a signed link
        to the full artifact, which holds every verified entry and the exact digested
        string so an auditor can recompute the digests independently.'
      summary: Verify a trail's hash chain
      parameters:
