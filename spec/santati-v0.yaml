        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEventCatalog'
              examples:
                StandardEventCatalog:
                  value:
                    packs:
                    - slug: agents
                      name: AI agents
                      description: Agent configuration, delegation, runs, tool calls,
                        approvals, guardrails and knowledge sources.
                      events:
                      - action: agent.tool.called
                        description: 'An agent called a tool. result: success or error.'
                        target_types:
                        - agent
                        - agent_run
                        - tool
                        required_metadata:
                        - gen_ai.tool.name
                        - result
                        optional_metadata:
                        - duration_ms
                        - gen_ai.tool.call.id
                        - gen_ai.tool.type
                        - source
                        - reason
                        - request_id
                        schema:
                          $schema: https://json-schema.org/draft/2020-12/schema
                          type: object
                          properties:
                            metadata:
                              type: object
                              properties:
                                gen_ai.tool.name:
                                  type: string
                                result:
                                  type: string
                                duration_ms:
                                  type: string
                                gen_ai.tool.call.id:
                                  type: string
                                gen_ai.tool.type:
                                  type: string
                                source:
                                  type: string
                                reason:
                                  type: string
                                request_id:
                                  type: string
                              required:
                              - gen_ai.tool.name
                              - result
                              additionalProperties:
                                type: string
                            actor:
                              type: object
                              properties:
                                metadata:
                                  type: object
                                  properties:
                                    on_behalf_of_type:
                                      type: string
                                    on_behalf_of_id:
                                      type: string
                                  dependentRequired:
                                    on_behalf_of_type:
                                    - on_behalf_of_id
                                    on_behalf_of_id:
                                    - on_behalf_of_type
                                  additionalProperties:
                                    type: string
                            targets:
                              type: array
                              items:
                                type: object
                                properties:
                                  metadata:
                                    type: object
                                    additionalProperties:
                                      type: string
