          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FieldErrors'
                - $ref: '#/components/schemas/ErrorDetail'
              examples:
                UnknownMatchRule:
                  value:
                    match_rules:
                    - Unknown match rule 'foo'.
                  summary: Unknown match rule
                MalformedJSON:
                  value:
                    detail: 'JSON parse error - Expecting value: line 1 column 1 (char
                      0)'
                  summary: Malformed JSON
          description: 'The edit was refused: a match rule, the destination config
            or the name is invalid, or the body is not JSON.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: Missing, invalid or under-scoped API key.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                NotFound:
                  value:
                    detail: No LogStream matches the given query.
                  summary: Not found
          description: No LogStream has that id, or it belongs to another team.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                DeliveryServiceUnavailable:
                  value:
                    detail: 'log stream delivery service unreachable: All connection
                      attempts failed'
                  summary: Delivery service unavailable
          description: The log stream delivery service is unreachable or refused the
            change.
    delete:
      operationId: streams_destroy
      description: Delete a stream and its destination. Requires the ``manage`` scope.
        The delivery service drops the stream's queue, its dead-letter queue and its
        stored spec first; when the service cannot be reached nothing is deleted and
        the request answers 503. Expects no request body and answers 204 with none.
      summary: Delete a log stream
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - log-streams
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: Missing, invalid or under-scoped API key.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                NotFound:
                  value:
                    detail: No LogStream matches the given query.
                  summary: Not found
          description: No LogStream has that id, or it belongs to another team.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                DeliveryServiceUnavailable:
                  value:
                    detail: 'log stream delivery service unreachable: All connection
                      attempts failed'
                  summary: Delivery service unavailable
          description: The log stream delivery service is unreachable or refused the
            change.
  /api/v0/streams/{id}/signing-secret/:
    get:
      operationId: streams_signing_secret_retrieve
      description: The Standard Webhooks signing secret this stream's outbound webhooks
        are signed with, and when the previous one stops verifying. Requires a team
        API key with the ``manage`` scope, because the secret is a credential. Both
        secrets sign during the 24-hour overlap after a rotation, so a verifier can
        be updated without a delivery gap.
      summary: Retrieve a stream signing secret
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - log-streams
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSecret'
              examples:
                SigningSecret:
                  value:
                    signing_secret: whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw
                    previous_signing_secret_expires_at: null
                  summary: Signing secret
          description: The current signing secret and the previous one's expiry.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: Missing, invalid or under-scoped API key.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                NotFound:
                  value:
                    detail: No LogStream matches the given query.
                  summary: Not found
          description: No LogStream has that id, or it belongs to another team.
  /api/v0/streams/{id}/signing-secret/rotate/:
    post:
      operationId: streams_signing_secret_rotate
      description: Mint a new signing secret for this stream. Requires a team API
        key with the ``manage`` scope. The current secret moves into the overlap slot
        and keeps verifying for 24 hours, so in-flight retries and an endpoint mid-update
        still pass. The stream's spec is pushed to the delivery service before the
        response; when the service refuses, the rotation is rolled back and the request
        answers 503. Expects no request body.
      summary: Rotate a stream signing secret
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - log-streams
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSecret'
              examples:
                RotatedSigningSecret:
                  value:
                    signing_secret: whsec_p5jXN8AQM9LWM0D4loKWxJekMfKQ9r8GKYqrTwjUPD8I
                    previous_signing_secret_expires_at: '2026-10-01T12:00:00Z'
                  summary: Rotated signing secret
          description: The new signing secret and when the previous one stops verifying.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: Missing, invalid or under-scoped API key.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                NotFound:
                  value:
                    detail: No LogStream matches the given query.
                  summary: Not found
          description: No LogStream has that id, or it belongs to another team.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                DeliveryServiceUnavailable:
                  value:
                    detail: 'log stream delivery service unreachable: All connection
                      attempts failed'
                  summary: Delivery service unavailable
          description: The log stream delivery service is unreachable or refused the
            change.
  /api/v0/trails/:
    get:
      operationId: trails_list
      description: 'This tenant''s audit log streams (trails), newest event first.
        Key-scoped: a key restricted to specific trails sees only those.'
      summary: List audit trails
      tags:
      - audit-trails
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditTrail'
              examples:
                BillingTrail:
                  value:
                  - name: billing
                    region: us-east
                    ingest_url: https://ingest.santati.io/webhooks/acme-logistics.billing
                  summary: Billing trail
          description: Every trail this key may write to, across the configured regions.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: Missing, invalid or under-scoped API key.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                TrailServiceUnavailable:
                  value:
                    detail: 'ankusa admin API unreachable: All connection attempts
                      failed'
                  summary: Trail service unavailable
          description: The audit log trail service (Ankusa) is unreachable, misconfigured,
            or the wrong version.
    post:
      operationId: trails_create
      description: Create an audit log stream (trail) that events can be sent to.
        Requires a team API key with the ``manage`` scope; a key already scoped to
        specific trails may not create more.
      summary: Create an audit trail
      tags:
      - audit-trails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditTrailCreateRequest'
            examples:
              CreateTrail:
                value:
                  name: billing
                  region: us-east
                summary: Create trail
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuditTrailCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuditTrailCreateRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTrail'
              examples:
                TrailCreated:
                  value:
                    name: billing
                    region: us-east
                    ingest_url: https://ingest.santati.io/webhooks/acme-logistics.billing
                  summary: Trail created
          description: The trail that was created, and the URL its producers POST
            to.
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FieldErrors'
                - $ref: '#/components/schemas/ErrorDetail'
              examples:
                ReservedName:
                  value:
                    name:
                    - That name is reserved. Pick another one.
                  summary: Reserved name
                MalformedJSON:
                  value:
                    detail: 'JSON parse error - Expecting value: line 1 column 1 (char
                      0)'
                  summary: Malformed JSON
          description: The name is reserved or malformed, or the body is not JSON.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
                TrailScopedKey:
                  value:
                    detail: This API key is scoped to specific audit log streams and
                      cannot create new ones.
                  summary: Trail scoped key
          description: Missing, invalid or under-scoped API key, or a key scoped to
            specific trails.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                TrailExists:
                  value:
                    detail: 'source already exists (409): {''error'': ''source_exists''}'
                  summary: Trail exists
          description: A trail with that name already exists for this tenant.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                TrailServiceUnavailable:
                  value:
                    detail: 'ankusa admin API unreachable: All connection attempts
                      failed'
                  summary: Trail service unavailable
                UnknownRegion:
                  value:
                    detail: Unknown region 'eu-west'.
                  summary: Unknown region
          description: The audit log trail service (Ankusa) is unreachable, misconfigured,
            running the wrong version or refusing writes, or `region` names a region
            this deployment does not serve.
  /api/v0/trails/{name}/:
    delete:
      operationId: trails_destroy
      description: Delete one of this tenant's audit log streams (trails). Requires
        a team API key with the ``manage`` scope. Events already indexed on the trail
        are not removed.
      summary: Delete an audit trail
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      - in: query
        name: region
        schema:
          type: string
        description: Region the trail lives in; blank means the deployment default.
      tags:
      - audit-trails
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: The trail was deleted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
              examples:
                InvalidTrailName:
                  value:
                    name:
                    - 'invalid source name: ''bad.name'''
                  summary: Invalid trail name
          description: 'The trail name is not one the trail service accepts: 1-64
            letters, digits, `-` or `_`.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
                TrailOutsideKeyScope:
                  value:
                    detail: This API key is not scoped to that audit log stream.
                  summary: Trail outside key scope
          description: Missing, invalid or under-scoped API key.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                TrailNotFound:
                  value:
                    detail: 'source not found (404): {''error'': ''source_not_found''}'
                  summary: Trail not found
          description: No such trail for this tenant.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                TrailServiceUnavailable:
                  value:
                    detail: 'ankusa admin API unreachable: All connection attempts
                      failed'
                  summary: Trail service unavailable
                UnknownRegion:
                  value:
                    detail: Unknown region 'eu-west'.
                  summary: Unknown region
          description: The audit log trail service (Ankusa) is unreachable, misconfigured,
            running the wrong version or refusing writes, or `region` names a region
            this deployment does not serve.
components:
  schemas:
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The producer's event id, or a generated ULID when none was
            sent.
        trail:
          type: string
          description: The audit log trail the event was indexed on.
          maxLength: 64
        event:
          type: string
          readOnly: true
          description: The event type, e.g. invoice.voided.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: RFC 3339, when the producer says the event happened.
        received_at:
          type: string
          format: date-time
          readOnly: true
          description: RFC 3339, when Santati indexed the event.
        organization_id:
          type: string
          description: The end-customer organization the producer attributed the event
            to; empty when none.
          maxLength: 255
        actor:
          allOf:
          - $ref: '#/components/schemas/EventActor'
          readOnly: true
          description: 'Who acted: the actor columns first, the producer''s payload
            behind them.'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/EventTarget'
          description: The objects this event acted on, in the producer's order.
          readOnly: true
        metadata:
          type: object
          additionalProperties:
            type: string
          description: The event's own key/value map; keys and values are strings
            on the wire.
          readOnly: true
        data:
          type: object
          additionalProperties: {}
          description: The producer's own payload for the event, stored verbatim.
          readOnly: true
        context:
          type: object
          additionalProperties: {}
          description: |-
            The producer's extra context, stored verbatim; the read path falls back to it for
            `actor` and `targets` when the top-level members are absent.
          readOnly: true
        hash:
          type: string
          readOnly: true
          description: sha256 of this event's chain record; empty until the seal task
            has run.
        schema_version:
          type: integer
          readOnly: true
          nullable: true
          description: The event schema version the event was validated against.
      required:
      - actor
      - context
      - created_at
      - data
      - event
      - hash
      - id
      - metadata
      - received_at
      - schema_version
      - targets
      - trail
    AuditEventExport:
      type: object
      description: |-
        One export job: what it covers, how far it got, and a fresh download link.

        ``download_url`` is null until the file exists and blank again once the link (or the
        file) has expired, so a client that polls this record never sees a URL it cannot use.
        A token is minted per response, so polling extends the window rather than racing it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The export's id, used to poll this record and to name the download
            URL.
        status:
          allOf:
          - $ref: '#/components/schemas/AuditEventExportStatusEnum'
          description: |-
            pending, running, complete, failed or expired.

            * `pending` - Pending
            * `running` - Running
            * `complete` - Complete
            * `failed` - Failed
            * `expired` - Expired
        format:
          allOf:
          - $ref: '#/components/schemas/FormatEnum'
          description: |-
            csv or jsonl.

            * `csv` - CSV
            * `jsonl` - JSON Lines
        row_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Rows written; 0 until the job completes.
        byte_size:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Size of the written file in bytes; 0 until the job completes.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: RFC 3339, when the export was requested.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339, when the worker picked the job up; null while pending.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339, when the job ended; null while pending or running.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339, when the file and its link stop working; null while
            the job is unfinished.
        error:
          type: string
          description: The terminal failure message; empty unless `status` is failed.
        download_url:
          type: string
          nullable: true
          description: Signed link to the file; null until the export completes, null
            again once it expires.
          readOnly: true
      required:
      - created_at
      - download_url
      - format
      - id
    AuditEventExportCreateRequest:
      type: object
      description: |-
        The request to start an export: which format, over which filter set.

        ``query`` is the same filter vocabulary the event list accepts, so a filter set is
        written once and works on both endpoints. It is canonicalised (and therefore
        validated) here, which means an unknown parameter name is a 400 naming it rather than
        a silently narrower file.
      properties:
        format:
          allOf:
          - $ref: '#/components/schemas/FormatEnum'
          description: |-
            csv: a header row and one row per event. jsonl: one ingest envelope per line.

            * `csv` - CSV
            * `jsonl` - JSON Lines
        query:
          type: string
          default: ''
          description: 'The filter set to export, as a URL query string: the same
            parameters `GET /api/v0/events/` accept, e.g. `trail=billing&created_after=2026-09-01`.
            Blank exports every event the key may read. Unknown parameter names are
            a 400 naming them.'
      required:
      - format
    AuditEventExportStatusEnum:
      enum:
      - pending
      - running
      - complete
      - failed
      - expired
      type: string
      description: |-
        * `pending` - Pending
        * `running` - Running
        * `complete` - Complete
        * `failed` - Failed
        * `expired` - Expired
    AuditTrail:
      type: object
      properties:
        name:
          type: string
          readOnly: true
          description: The trail's name, unique within the team.
        region:
          type: string
          readOnly: true
          description: The region the trail's store lives in.
        ingest_url:
          type: string
          readOnly: true
          description: Where producers POST this trail's events.
      required:
      - ingest_url
      - name
      - region
    AuditTrailCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: The new trail's name, unique within the team.
          pattern: ^[A-Za-z0-9_-]{1,64}$
          maxLength: 64
        region:
          type: string
          default: ''
          description: The region to provision the trail in; blank means the deployment
            default.
      required:
      - name
    ChainEntry:
      type: object
      description: One sealed event as the verifier saw it. `digest_input` stays in
        the artifact.
      properties:
        seq:
          type: integer
          description: Position in the trail's append-only chain, starting at 1.
        id:
          type: string
          description: The producer's event id.
        prev_hash:
          type: string
          description: The digest of the previous chain position; empty at genesis.
        hash:
          type: string
          description: sha256 over the canonical record for this position.
        occurred_at:
          type: string
          format: date-time
          description: When the producer says it happened.
        received_at:
          type: string
          format: date-time
          description: When Santati indexed it.
      required:
      - hash
      - id
      - occurred_at
      - prev_hash
      - received_at
      - seq
    ChainHead:
      type: object
      description: The trail's current chain head, and whether this pass reached it.
      properties:
        seq:
          type: integer
          nullable: true
          description: Head position; null when the trail has never sealed.
        hash:
          type: string
          description: Head digest; empty when the trail has never sealed.
        tail_verified:
          type: boolean
          description: True only when the range reached the head and the head's digest
            is the last one verified.
      required:
      - hash
      - seq
      - tail_verified
    ChainVerifyResponse:
      type: object
      description: |-
        A verification result. `status` is `broken` when the chain failed to verify.

        `entries` is the first `SANTATI_CHAIN_REPORT_INLINE_MAX_ENTRIES` verified
        entries and is informational; the artifact holds every one of them with the
        exact digested string. The inline entries ride on the report instance rather
        than on a column, because they exist only for the response that produced them.
      properties:
        trail:
          type: string
          description: The trail that was verified.
        range:
          type: object
          description: The window verified; a null bound means genesis or head.
          properties:
            from:
              type: string
              format: date-time
              nullable: true
              description: Start of the window, inclusive; null means genesis.
            to:
              type: string
              format: date-time
              nullable: true
              description: End of the window, exclusive; null means the chain head.
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ChainVerifyResponseStatusEnum'
          description: |-
            Broken is a successful verification: the chain failed to verify.

            * `ok` - ok
            * `broken` - broken
        checked:
          type: integer
          description: Entries the pass consumed, including the one that broke it.
        unsealed:
          type: integer
          description: Rows in range still awaiting their seal task; never a break.
        backfilled:
          type: integer
          description: Imported rows, outside the chain by construction; never a break.
        first_seq:
          type: integer
          nullable: true
          description: First chain position verified; null when none were.
        last_seq:
          type: integer
          nullable: true
          description: Last chain position verified; null when none were.
        head:
          allOf:
          - $ref: '#/components/schemas/ChainHead'
          readOnly: true
          description: The trail's current chain head, and whether this pass reached
            it.
        break:
          description: The first position that failed, in chain order.
          properties:
            seq:
              type: integer
              description: The failing position, or the first missing one for a gap.
            id:
              type: string
              description: The event at that position; empty when the row is missing.
            reason:
              allOf:
              - $ref: '#/components/schemas/ReasonEnum'
              description: |-
                hash_mismatch: the digest does not recompute. prev_hash_mismatch: the link is wrong. seq_gap: a position is missing.

                * `hash_mismatch` - hash_mismatch
                * `prev_hash_mismatch` - prev_hash_mismatch
                * `seq_gap` - seq_gap
            expected_hash:
              type: string
              description: The digest the chain requires here.
            actual_hash:
              type: string
              description: What the stored row provides; empty for a gap.
          required:
          - actual_hash
          - expected_hash
          - id
          - reason
          - seq
          nullable: true
          readOnly: true
          type: object
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ChainEntry'
          description: The first inline entries of the verified range, in chain order.
          readOnly: true
        entries_truncated:
          type: boolean
          description: True when `entries` holds only the first page of the verified
            range.
          readOnly: true
        report_id:
          type: string
          format: uuid
          description: The stored report's id; also names the artifact URL.
        report_url:
          type: string
          description: Signed link to the full artifact; no API key needed to use
            it.
          readOnly: true
        artifact_bytes:
          type: integer
          description: Size of the gzip artifact in bytes.
        artifact_sha256:
          type: string
          description: sha256 of the artifact's bytes, as downloadable.
        artifact_expires_at:
          type: string
          format: date-time
          description: When `report_url`'s signed token stops working; the file itself
            is removed by an operator.
      required:
      - artifact_bytes
      - artifact_expires_at
      - artifact_sha256
      - backfilled
      - break
      - checked
      - entries
      - entries_truncated
      - first_seq
      - head
      - last_seq
      - range
      - report_id
      - report_url
      - status
      - trail
      - unsealed
    ChainVerifyResponseStatusEnum:
      enum:
      - ok
      - broken
