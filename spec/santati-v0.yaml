              examples:
                DraftVersion:
                  value:
                    version: 2
                    status: draft
                    schema:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      type: object
                      properties:
                        metadata:
                          type: object
                          properties:
                            invoice_number:
                              type: string
                            void_reason:
                              type: string
                            source:
                              type: string
                            reason:
                              type: string
                            request_id:
                              type: string
                          required:
                          - invoice_number
                          additionalProperties:
                            type: string
                        actor:
                          type: object
                          properties:
                            metadata:
                              type: object
                              properties:
                                on_behalf_of_type:
                                  type: string
                                on_behalf_of_id:
                                  type: string
                              dependentRequired:
                                on_behalf_of_type:
                                - on_behalf_of_id
                                on_behalf_of_id:
                                - on_behalf_of_type
                              additionalProperties:
                                type: string
                        targets:
                          type: array
                          items:
                            type: object
                            properties:
                              metadata:
                                type: object
