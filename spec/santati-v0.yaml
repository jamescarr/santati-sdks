  /api/v0/standard-events/install/:
    post:
      operationId: standard_events_install
      description: 'Define every action of the chosen packs for the team, each with
        its recommended target types and a published v1 schema. An action the team
        already defines, active or retired, is skipped and left untouched, so installing
        twice is safe. Installed schemas are the team''s own copies: editing one needs
        no special step. Requires the ``manage`` scope on a key that is not limited
        to named trails.'
