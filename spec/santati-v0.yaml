                          type: string
                      actor:
                        type: object
                        properties:
                          metadata:
                            type: object
                            properties:
                              on_behalf_of_type:
                                type: string
                              on_behalf_of_id:
                                type: string
                            dependentRequired:
                              on_behalf_of_type:
                              - on_behalf_of_id
                              on_behalf_of_id:
                              - on_behalf_of_type
                            additionalProperties:
                              type: string
                      targets:
                        type: array
                        items:
                          type: object
                          properties:
                            metadata:
                              type: object
                              additionalProperties:
                                type: string
                summary: A schema document
          application/x-www-form-urlencoded:
            schema:
