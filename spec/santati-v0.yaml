      description: |-
        * `ok` - ok
        * `broken` - broken
    ContentTypeEnum:
      enum:
      - json
      - ndjson
      type: string
      description: |-
        * `json` - json
        * `ndjson` - ndjson
    DestinationTypeEnum:
      enum:
      - https
      type: string
      description: '* `https` - Webhook'
    ErrorBody:
      type: object
      description: One rejection, in the shape contracts §7 reserves for event ingestion.
      required:
      - code
      - message
      - field
