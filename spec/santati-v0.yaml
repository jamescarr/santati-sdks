    post:
      operationId: events_create
      description: 'Index one event, or a batch, from the producer envelope. Requires
        a team API key with the ``write`` (or ``manage``) scope. Send either one envelope
        object or ``{"events": [...]}``; a batch answers 207 with per-item results
        and 202 when every item was accepted. A repeated ``Idempotency-Key`` (or envelope
        ``idempotency_key``) within 24 hours returns the event already stored instead
        of indexing a second one.'
      summary: Send audit events
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          maxLength: 255
        description: 'Replay guard for a single-event request. Sending the same key
          again on the same trail within 24 hours returns the event already stored
          (`200`) instead of indexing a second one. A longer key than 255 characters
          is a `400 invalid_envelope`. An event''s own `idempotency_key` beats this
          header for that event. Do not send it with a multi-event batch: it becomes
          the key of every event that has none of its own, and keys are scoped to
          the team and trail, so each later such event on the same trail is reported
          `duplicate` with the first event''s id and is not written.'
      tags:
      - audit-events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventIngestRequest'
            examples:
              SingleEvent:
                value:
                  event: invoice.voided
                  trail: billing
                  created_at: '2026-09-29T14:03:11.482000Z'
                  organization_id: org_acme_logistics
                  idempotency_key: invoice-voided-inv_555
                  actor:
                    type: user
                    id: usr_123
                    name: Dana Ortiz
                    metadata: {}
                  targets:
                  - type: invoice
                    id: inv_555
                    name: INV-555
                    metadata: {}
                  metadata:
                    source: dashboard
                    region: us-east
                  data:
                    object: invoice
                    id: inv_555
                    status: void
                  context:
                    correlation:
                      request_id: req_7f3a9c
                summary: Single event
              BatchOfEvents:
                value:
                  events:
                  - event: invoice.voided
                    trail: billing
                    created_at: '2026-09-29T14:03:11.482000Z'
                    organization_id: org_acme_logistics
                    idempotency_key: invoice-voided-inv_555
                    actor:
                      type: user
                      id: usr_123
                      name: Dana Ortiz
                      metadata: {}
                    targets:
                    - type: invoice
                      id: inv_555
                      name: INV-555
                      metadata: {}
                    metadata:
                      source: dashboard
                    data:
                      object: invoice
                      id: inv_555
                      status: void
                    context: {}
                  - event: invoice.paid
                    trail: billing
                    created_at: '2026-09-29T14:04:07.113000Z'
                    organization_id: org_acme_logistics
                    idempotency_key: invoice-paid-inv_555
                    actor:
                      type: user
                      id: usr_123
                      name: Dana Ortiz
                      metadata: {}
                    targets:
                    - type: invoice
                      id: inv_555
                      name: INV-555
                      metadata: {}
                    metadata:
                      source: dashboard
                    data:
                      object: invoice
                      id: inv_555
                      status: paid
                    context: {}
                summary: Batch of events
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
              examples:
                EventRecorded:
                  value:
                    id: 01J9Z6K3M4QX8RT2VN5B7HCWDA
                    trail: billing
                    event: invoice.voided
                    created_at: '2026-09-29T14:03:11.482000Z'
                    received_at: '2026-09-29T14:03:12.019000Z'
                    organization_id: org_acme_logistics
                    actor:
                      type: user
                      id: usr_123
                      name: Dana Ortiz
                      metadata: {}
                    targets:
                    - type: invoice
                      id: inv_555
                      name: INV-555
                      metadata: {}
                    metadata:
                      source: dashboard
                      region: us-east
                    data:
                      object: invoice
                      id: inv_555
                      customer_id: cus_987
                      status: void
                      amount_cents: 4200
                      currency: usd
                    context:
                      correlation:
                        request_id: req_7f3a9c
                    hash: ''
                    schema_version: 1
                  summary: Event recorded
          description: The event was indexed. Its chain seal task runs after this
            response, so `hash` is empty.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
              examples:
                IdempotentReplay:
                  value:
                    id: 01J9Z6K3M4QX8RT2VN5B7HCWDA
                    trail: billing
                    event: invoice.voided
                    created_at: '2026-09-29T14:03:11.482000Z'
                    received_at: '2026-09-29T14:03:12.019000Z'
                    organization_id: org_acme_logistics
                    actor:
                      type: user
                      id: usr_123
                      name: Dana Ortiz
                      metadata: {}
                    targets:
                    - type: invoice
                      id: inv_555
                      name: INV-555
                      metadata: {}
                    metadata:
                      source: dashboard
                      region: us-east
                    data:
                      object: invoice
                      id: inv_555
                      customer_id: cus_987
                      status: void
                      amount_cents: 4200
                      currency: usd
                    context:
                      correlation:
                        request_id: req_7f3a9c
                    hash: b7c0f2a5d8e14f3a6c9b2d5e8f1a4c7b0d3e6f9a2c5b8d1e4f7a0c3b6d9e2f5a
                    schema_version: 1
                  summary: Idempotent replay
          description: The event was already stored under the same idempotency key;
            the stored copy is returned.
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatchResult'
              examples:
                BatchAccepted:
                  value:
                    accepted: 2
                    rejected: 0
                    results:
                    - index: 0
                      status: accepted
                      id: 01J9Z6K3M4QX8RT2VN5B7HCWDA
                    - index: 1
                      status: duplicate
                      id: 01J9Z6K3M4QX8RT2VN5B7HCWDB
                  summary: Batch accepted
          description: A batch was submitted and every item was indexed (or replayed).
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatchResult'
              examples:
                BatchPartiallyRejected:
                  value:
                    accepted: 1
                    rejected: 1
                    results:
                    - index: 0
                      status: accepted
                      id: 01J9Z6K3M4QX8RT2VN5B7HCWDA
                    - index: 1
                      status: rejected
                      error:
                        code: unknown_action
                        message: Action 'invoice.deleted' is not defined for this
                          team.
                        field: event
                  summary: Batch partially rejected
          description: A batch was submitted and at least one item was rejected; the
            other items were indexed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                BodyNotAnObject:
                  value:
                    error:
                      code: invalid_envelope
                      message: The request body must be a JSON object.
                      field: null
                  summary: Body not an object
                EmptyBatch:
                  value:
                    error:
                      code: invalid_envelope
                      message: events must contain at least one event.
                      field: events
                  summary: Empty batch
                IdempotencyKeyTooLong:
                  value:
                    error:
                      code: invalid_envelope
                      message: Idempotency-Key must be at most 255 characters.
                      field: idempotency_key
                  summary: Idempotency key too long
          description: 'The event could not be indexed: the body is not a JSON object,
            the batch is empty, the `Idempotency-Key` header is over 255 characters,
            or one event was rejected (a rejected single event answers its own code).'
        '403':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorDetail'
                - $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
                TrailNotAllowed:
                  value:
                    error:
                      code: trail_not_allowed
                      message: This API key is not scoped to that audit log stream.
                      field: trail
                  summary: Trail not allowed
          description: Missing, invalid or under-scoped API key, or an event naming
            a trail this key may not write to.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                BodyTooLarge:
                  value:
                    error:
                      code: payload_too_large
                      message: Request body exceeds 1048576 bytes.
                      field: null
                  summary: Body too large
                BatchTooLarge:
                  value:
                    error:
                      code: payload_too_large
                      message: A batch may contain at most 500 events.
                      field: events
                  summary: Batch too large
          description: The request body or the batch is larger than the published
            ceiling.
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before retrying, sent on every 429.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                RateLimited:
                  value:
                    error:
                      code: rate_limited
                      message: 'Rate limit exceeded: at most 600 requests per minute
                        per team.'
                      field: null
                  summary: Rate limited
                MonthlyQuotaExceeded:
                  value:
                    error:
                      code: quota_exceeded
                      message: Monthly event quota of 1000000 exceeded.
                      field: null
                  summary: Monthly quota exceeded
                  description: Free tier only. The ceiling is the deployment's `SANTATI_FREE_MONTHLY_EVENT_QUOTA`
                    (1000000 here); a team with an active subscription is billed for
                    overage instead of refused, and a deployment that sets no free-tier
                    quota never answers this.
          description: This team is over its request rate or its monthly event quota.
