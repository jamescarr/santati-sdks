                                  type: string
                              dependentRequired:
                                on_behalf_of_type:
                                - on_behalf_of_id
                                on_behalf_of_id:
                                - on_behalf_of_type
                              additionalProperties:
                                type: string
                        targets:
                          type: array
                          items:
                            type: object
                            properties:
                              metadata:
                                type: object
                                additionalProperties:
                                  type: string
                    published_at: null
                    deprecated_at: null
                    deprecation_deadline: null
                    created_at: '2026-09-29T14:03:11.482000Z'
                    updated_at: '2026-09-29T14:20:05.001000Z'
                  summary: Draft version
                PublishedVersion:
                  value:
                    version: 2
                    status: published
                    schema:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      type: object
                      properties:
                        metadata:
                          type: object
