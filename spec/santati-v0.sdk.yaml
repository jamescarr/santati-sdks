openapi: 3.0.3
info:
  title: Santati
  version: 0.3.0
  description: 'Santati''s HTTP API. Operations under `/api/v0/` take a team API key in `Authorization: Api-Key <key>`; a
    missing, invalid or under-scoped key is answered with `403`, never `401`. Errors on `/api/v0/` use one of three bodies:
    `ErrorDetail` (`{"detail": ...}`), `FieldErrors` (messages keyed by request field) or `ErrorEnvelope` (`{"error": {"code",
    "message", "field"}}`, returned by event ingestion and log stream quota checks). Lists on `/api/v0/` are cursor-paginated:
    follow `next` until it is `null`.'
paths:
  /api/v0/event-definitions/:
    get:
      operationId: event_definitions_list
      description: 'The actions this team''s catalog defines, alphabetically. Needs a team API key with any scope. A team
        with no definitions accepts any action name, so an empty page is not an error: it means enforcement is off. Cursor-paginated:
        follow ``next`` until it is ``null``.'
      summary: List event definitions
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Cursor from the previous page.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - event-definitions
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventDefinitionList'
              examples:
                InvoiceVoidedDefinition:
                  value:
                    next: https://api.santati.io/api/v0/event-definitions/?cursor=cD00ODY%3D
                    previous: https://api.santati.io/api/v0/event-definitions/?cursor=cj0xJnA9NDg3
                    results:
                    - action: invoice.voided
                      description: An issued invoice was voided before payment.
                      allowed_target_types:
                      - invoice
                      is_active: true
                      created_at: '2026-09-29T14:03:11.482000Z'
                      updated_at: '2026-09-29T14:03:11.482000Z'
                  summary: Invoice voided definition
          description: A page of this team's event definitions.
        '403':
          description: Missing, invalid or under-scoped API key.
        '404':
          description: The cursor is not one this endpoint issued.
    post:
      operationId: event_definitions_create
      description: 'Add an action to the catalog. Requires the ``manage`` scope on a key that is not limited to named trails.
        Defining the first action turns catalog enforcement on: events with any other action name are refused from then on.
        Add schemas with ``schema_versions_create``.'
      summary: Define an action
      tags:
      - event-definitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDefinitionWriteRequest'
            examples:
              DefineAnAction:
                value:
                  action: invoice.voided
                  description: An issued invoice was voided before payment.
                  allowed_target_types:
                  - invoice
                  is_active: true
                summary: Define an action
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventDefinitionWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventDefinitionWriteRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinition'
              examples:
                InvoiceVoidedDefinition:
                  value:
                    action: invoice.voided
                    description: An issued invoice was voided before payment.
                    allowed_target_types:
                    - invoice
                    is_active: true
                    created_at: '2026-09-29T14:03:11.482000Z'
                    updated_at: '2026-09-29T14:03:11.482000Z'
                  summary: Invoice voided definition
          description: The action as stored.
        '400':
          description: 'The definition was refused: the action is malformed, reserved or already defined, a target type is
            malformed, or the body is not JSON.'
        '403':
          description: Missing, invalid or under-scoped API key.
  /api/v0/event-definitions/{action}/:
    get:
      operationId: event_definitions_retrieve
      description: One action of this team's catalog. Needs a team API key with any scope.
      summary: Retrieve an event definition
      parameters:
      - in: path
        name: action
        schema:
          type: string
        description: The action name, e.g. invoice.voided.
        required: true
      tags:
      - event-definitions
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinition'
              examples:
                InvoiceVoidedDefinition:
                  value:
                    action: invoice.voided
                    description: An issued invoice was voided before payment.
                    allowed_target_types:
                    - invoice
                    is_active: true
                    created_at: '2026-09-29T14:03:11.482000Z'
                    updated_at: '2026-09-29T14:03:11.482000Z'
                  summary: Invoice voided definition
          description: The definition.
        '403':
          description: Missing, invalid or under-scoped API key.
        '404':
          description: No EventDefinition has that id, or it belongs to another team.
    patch:
      operationId: event_definitions_update
      description: Change any of an action's fields; omitted fields keep their value. Sending a new ``action`` renames it,
        and its schema versions go with it. Events already stored keep the name they were written with. Requires the ``manage``
        scope on a key that is not limited to named trails.
      summary: Update or rename an event definition
      parameters:
      - in: path
        name: action
        schema:
          type: string
        description: The action name, e.g. invoice.voided.
        required: true
      tags:
      - event-definitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventDefinitionWriteRequest'
            examples:
              RenameAnAction:
                value:
                  action: invoice.cancelled
                summary: Rename an action
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventDefinitionWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventDefinitionWriteRequest'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinition'
              examples:
                InvoiceVoidedDefinition:
                  value:
                    action: invoice.voided
                    description: An issued invoice was voided before payment.
                    allowed_target_types:
                    - invoice
                    is_active: true
                    created_at: '2026-09-29T14:03:11.482000Z'
                    updated_at: '2026-09-29T14:03:11.482000Z'
                  summary: Invoice voided definition
          description: The definition as it now stands.
        '400':
          description: 'The definition was refused: the action is malformed, reserved or already defined, a target type is
            malformed, or the body is not JSON.'
        '403':
          description: Missing, invalid or under-scoped API key.
        '404':
          description: No EventDefinition has that id, or it belongs to another team.
    delete:
      operationId: event_definitions_destroy
      description: Delete an action and all of its schema versions, published ones included. Requires the ``manage`` scope
        on a key that is not limited to named trails. Deleting the team's last definition turns catalog enforcement off, so
        any action name is accepted again. Expects no request body and answers 204 with none.
      summary: Delete an event definition
      parameters:
      - in: path
        name: action
        schema:
          type: string
        description: The action name, e.g. invoice.voided.
        required: true
      tags:
      - event-definitions
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: Missing, invalid or under-scoped API key.
        '404':
          description: No EventDefinition has that id, or it belongs to another team.
  /api/v0/event-definitions/{action}/schema-versions/:
