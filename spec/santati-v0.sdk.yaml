      description: 'Index one event, or a batch, from the producer envelope. Requires a team API key with the ``write`` (or
        ``manage``) scope. Send either one envelope object or ``{"events": [...]}``; a batch answers 207 with per-item results
        and 202 when every item was accepted. A repeated ``Idempotency-Key`` (or envelope ``idempotency_key``) within 24 hours
        returns the event already stored instead of indexing a second one.'
      summary: Send audit events
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Replay guard for a single-event request. Sending the same key again on the same trail within 24 hours
          returns the event already stored (`200`) instead of indexing a second one. A longer key than 255 characters is a
          `400 invalid_envelope`. An event''s own `idempotency_key` beats this header for that event. Do not send it with
          a multi-event batch: it becomes the key of every event that has none of its own, and keys are scoped to the team
          and trail, so each later such event on the same trail is reported `duplicate` with the first event''s id and is
          not written.'
      tags:
      - audit-events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventIngestRequest'
            examples:
              SingleEvent:
                value:
                  event: invoice.voided
                  trail: billing
                  created_at: '2026-09-29T14:03:11.482000Z'
                  organization_id: org_acme_logistics
                  idempotency_key: invoice-voided-inv_555
                  actor:
