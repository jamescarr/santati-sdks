                          items:
                            type: object
                            properties:
                              metadata:
                                type: object
                                additionalProperties:
                                  type: string
                    published_at: '2026-09-29T14:30:00.000000Z'
                    deprecated_at: null
                    deprecation_deadline: null
                    created_at: '2026-09-29T14:03:11.482000Z'
                    updated_at: '2026-09-29T14:20:05.001000Z'
                  summary: Published version
                DeprecatedVersion:
                  value:
                    version: 1
                    status: deprecated
                    schema:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      type: object
                      properties:
                        metadata:
                          type: object
                          properties:
                            invoice_number:
                              type: string
                            void_reason:
                              type: string
                            source:
                              type: string
                            reason:
                              type: string
                            request_id:
                              type: string
                          required:
                          - invoice_number
                          additionalProperties:
                            type: string
                        actor:
                          type: object
                          properties:
                            metadata:
                              type: object
                              properties:
                                on_behalf_of_type:
                                  type: string
