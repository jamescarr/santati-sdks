                                  type: string
                              dependentRequired:
                                on_behalf_of_type:
                                - on_behalf_of_id
                                on_behalf_of_id:
                                - on_behalf_of_type
                              additionalProperties:
                                type: string
                        targets:
                          type: array
                          items:
                            type: object
                            properties:
                              metadata:
                                type: object
                                additionalProperties:
                                  type: string
                    published_at: '2026-09-01T09:00:00.000000Z'
                    deprecated_at: '2026-09-29T14:30:00.000000Z'
                    deprecation_deadline: '2026-12-28T14:30:00.000000Z'
                    created_at: '2026-09-29T14:03:11.482000Z'
                    updated_at: '2026-09-29T14:20:05.001000Z'
