                                - on_behalf_of_id
                                on_behalf_of_id:
                                - on_behalf_of_type
                              additionalProperties:
                                type: string
                        targets:
                          type: array
                          items:
                            type: object
                            properties:
                              metadata:
                                type: object
                                additionalProperties:
                                  type: string
                    published_at: null
                    deprecated_at: null
                    deprecation_deadline: null
                    created_at: '2026-09-29T14:03:11.482000Z'
                    updated_at: '2026-09-29T14:20:05.001000Z'
                  summary: Draft version
          description: The new draft.
        '400':
          description: 'The document was refused: it is not a JSON object, is too large, is not a valid JSON Schema 2020-12
            document, has a remote `$ref`, or the body is not JSON.'
        '403':
          description: Missing, invalid or under-scoped API key.
        '404':
          description: No EventDefinition has that id, or it belongs to another team.
        '409':
          description: Another request created a version at the same moment; send the request again.
  /api/v0/event-definitions/{action}/schema-versions/{version}/:
