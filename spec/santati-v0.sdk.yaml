                              type: string
                            void_reason:
                              type: string
                            source:
                              type: string
                            reason:
                              type: string
                            request_id:
                              type: string
                          required:
                          - invoice_number
                          additionalProperties:
                            type: string
                        actor:
                          type: object
                          properties:
                            metadata:
                              type: object
                              properties:
                                on_behalf_of_type:
                                  type: string
                                on_behalf_of_id:
                                  type: string
                              dependentRequired:
