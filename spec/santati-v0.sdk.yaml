          description: The version.
        '403':
          description: Missing, invalid or under-scoped API key.
        '404':
          description: The action is not defined for this team, or it has no such schema version.
    put:
      operationId: schema_versions_update
      description: 'Replace the whole document of a draft in place; the version number does not change. This is how fields
        are added, renamed and removed: read the draft, edit its `properties` and `required`, and send the document back.
        Send the `ETag` you read as `If-Match` so a concurrent edit is not overwritten. A published version cannot be changed.
        Requires the ``manage`` scope on a key that is not limited to named trails.'
      summary: Replace a draft's document
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: The `ETag` from your last read of this draft. If the draft has changed since, the update answers `412`
          instead of overwriting it. Without the header the last write wins.
      - in: path
        name: action
        schema:
          type: string
        description: The action name, e.g. invoice.voided.
        required: true
      - in: path
