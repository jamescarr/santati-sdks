    post:
      operationId: schema_versions_create
      description: Store a document as a new draft at the next version number; numbers are never reused. A draft validates
        nothing until it is published. To change a published version, create a draft from its document with your edit applied.
        Requires the ``manage`` scope on a key that is not limited to named trails.
      summary: Create a draft schema version
      parameters:
      - in: path
        name: action
        schema:
          type: string
        description: The action name, e.g. invoice.voided.
        required: true
      tags:
      - event-definitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSchemaDocumentRequest'
            examples:
              ASchemaDocument:
                value:
                  schema:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    type: object
                    properties:
                      metadata:
                        type: object
                        properties:
                          invoice_number:
                            type: string
                          void_reason:
                            type: string
                          source:
                            type: string
                          reason:
                            type: string
                          request_id:
                            type: string
                        required:
                        - invoice_number
                        additionalProperties:
                          type: string
                      actor:
                        type: object
                        properties:
                          metadata:
                            type: object
                            properties:
                              on_behalf_of_type:
                                type: string
                              on_behalf_of_id:
                                type: string
                            dependentRequired:
                              on_behalf_of_type:
