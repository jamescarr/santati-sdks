          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventSchemaDocumentRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          headers:
            ETag:
              schema:
                type: string
              description: A validator for this version; it changes whenever the version does. Send it back as `If-Match`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSchemaVersion'
              examples:
                DraftVersion:
                  value:
                    version: 2
                    status: draft
                    schema:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      type: object
                      properties:
                        metadata:
                          type: object
                          properties:
