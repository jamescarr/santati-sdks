                summary: Single event
              BatchOfEvents:
                value:
                  events:
                  - event: invoice.voided
                    trail: billing
                    created_at: '2026-09-29T14:03:11.482000Z'
                    organization_id: org_acme_logistics
                    idempotency_key: invoice-voided-inv_555
                    actor:
                      type: user
                      id: usr_123
                      name: Dana Ortiz
                      metadata: {}
                    targets:
                    - type: invoice
                      id: inv_555
                      name: INV-555
                      metadata: {}
                    metadata:
                      source: dashboard
                    data:
                      object: invoice
                      id: inv_555
                      status: void
                    context: {}
                  - event: invoice.paid
                    trail: billing
                    created_at: '2026-09-29T14:04:07.113000Z'
                    organization_id: org_acme_logistics
                    idempotency_key: invoice-paid-inv_555
