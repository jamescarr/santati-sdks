                    id: usr_123
                    name: Dana Ortiz
                    metadata: {}
                  targets:
                  - type: invoice
                    id: inv_555
                    name: INV-555
                    metadata: {}
                  metadata:
                    source: dashboard
                    region: us-east
                  data:
                    object: invoice
                    id: inv_555
                    status: void
                  context:
                    correlation:
