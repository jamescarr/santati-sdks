                    rejected: 1
                    results:
                    - index: 0
                      status: accepted
                      id: 01J9Z6K3M4QX8RT2VN5B7HCWDA
                    - index: 1
                      status: rejected
                      error:
                        code: unknown_action
                        message: Action 'invoice.deleted' is not defined for this team.
                        field: event
                  summary: Batch partially rejected
          description: A batch was submitted and at least one item was rejected; the other items were indexed.
        '400':
          description: 'The event could not be indexed: the body is not a JSON object, the batch is empty, the `Idempotency-Key`
            header is over 255 characters, or one event was rejected (a rejected single event answers its own code).'
        '403':
          description: Missing, invalid or under-scoped API key, or an event naming a trail this key may not write to.
        '413':
          description: The request body or the batch is larger than the published ceiling.
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before retrying, sent on every 429.
          description: This team is over its request rate or its monthly event quota.
  /api/v0/standard-events/:
    get:
      operationId: standard_events_list
      description: 'Santati''s recommended actions, grouped into packs. The catalog is the same for every team and any key
        scope reads it; install packs with `standard_events_install`. `schema` is the v1 document installed for each action:
        installing copies it into the team''s catalog, and the copy is the team''s own to edit like any custom schema. `ocsf`
        maps each action to an OCSF class and activity. Not paginated.'
      summary: List the standard event catalog
      tags:
      - event-definitions
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEventCatalog'
              examples:
                StandardEventCatalog:
                  value:
                    packs:
                    - slug: agents
                      name: AI agents
                      description: Agent configuration, delegation, runs, tool calls, approvals, guardrails and knowledge
                        sources.
                      events:
                      - action: agent.tool.called
                        description: 'An agent called a tool. result: success or error.'
                        target_types:
                        - agent
                        - agent_run
                        - tool
                        required_metadata:
                        - gen_ai.tool.name
                        - result
                        optional_metadata:
                        - duration_ms
                        - gen_ai.tool.call.id
                        - gen_ai.tool.type
                        - source
                        - reason
                        - request_id
                        schema:
                          $schema: https://json-schema.org/draft/2020-12/schema
                          type: object
                          properties:
                            metadata:
                              type: object
                              properties:
                                gen_ai.tool.name:
                                  type: string
                                result:
                                  type: string
                                duration_ms:
                                  type: string
                                gen_ai.tool.call.id:
                                  type: string
                                gen_ai.tool.type:
                                  type: string
                                source:
                                  type: string
                                reason:
                                  type: string
                                request_id:
                                  type: string
                              required:
                              - gen_ai.tool.name
                              - result
                              additionalProperties:
                                type: string
                            actor:
                              type: object
                              properties:
                                metadata:
                                  type: object
                                  properties:
                                    on_behalf_of_type:
                                      type: string
                                    on_behalf_of_id:
                                      type: string
                                  dependentRequired:
                                    on_behalf_of_type:
                                    - on_behalf_of_id
                                    on_behalf_of_id:
                                    - on_behalf_of_type
                                  additionalProperties:
                                    type: string
                            targets:
                              type: array
                              items:
                                type: object
                                properties:
                                  metadata:
                                    type: object
                                    additionalProperties:
                                      type: string
                        ocsf:
                          version: 1.9.0
                          class_uid: 6003
                          activity_id: 99
                          status_id: null
                  summary: Standard event catalog
          description: Every standard pack with its actions, schemas and OCSF mappings.
        '403':
          description: Missing, invalid or under-scoped API key.
  /api/v0/standard-events/install/:
    post:
      operationId: standard_events_install
      description: 'Define every action of the chosen packs for the team, each with its recommended target types and a published
        v1 schema. An action the team already defines, active or retired, is skipped and left untouched, so installing twice
        is safe. Installed schemas are the team''s own copies: editing one needs no special step. Requires the ``manage``
        scope on a key that is not limited to named trails.'
      summary: Install standard packs
      tags:
      - event-definitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardPackInstallRequest'
            examples:
              InstallTheAgentsPack:
                value:
                  packs:
                  - agents
                summary: Install the agents pack
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StandardPackInstallRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StandardPackInstallRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPackInstallResult'
              examples:
                PackInstalled:
                  value:
                    created:
                    - agent.tool.called
                    skipped:
                    - agent.created
                  summary: Pack installed
          description: Which actions were defined and which were already there.
        '400':
          description: A pack slug is not one the catalog lists, none was given, or the body is not JSON.
        '403':
          description: Missing, invalid or under-scoped API key.
        '409':
          description: Another request changed the catalog during the install. Nothing was added.
components:
  schemas:
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          description: The producer's event id, or a generated ULID when none was sent.
        trail:
          type: string
          description: The audit log trail the event was indexed on.
        event:
          type: string
          description: The event type, e.g. invoice.voided.
        created_at:
          type: string
          description: RFC 3339, when the producer says the event happened.
        received_at:
          type: string
          description: RFC 3339, when Santati indexed the event.
        organization_id:
          type: string
          description: The end-customer organization the producer attributed the event to; empty when none.
        actor:
          allOf:
          - $ref: '#/components/schemas/EventActor'
          description: 'Who acted: the actor columns first, the producer''s payload behind them.'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/EventTarget'
          description: The objects this event acted on, in the producer's order.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: The event's own key/value map; keys and values are strings on the wire.
        data:
          type: object
          additionalProperties: {}
          description: The producer's own payload for the event, stored verbatim.
        context:
          type: object
          additionalProperties: {}
          description: 'The producer''s extra context, stored verbatim; the read path falls back to it for

            `actor` and `targets` when the top-level members are absent.'
        hash:
          type: string
          description: sha256 of this event's chain record; empty until the seal task has run.
        schema_version:
          type: integer
          nullable: true
          description: The event schema version the event was validated against.
      required:
      - actor
      - context
      - created_at
      - data
      - event
      - hash
      - id
      - metadata
      - received_at
      - schema_version
      - targets
      - trail
    ErrorBody:
      type: object
      description: One rejection, in the shape contracts §7 reserves for event ingestion.
      required:
      - code
      - message
      - field
      properties:
        code:
          type: string
          description: 'Reserved failure code, one of: `invalid_envelope`, `unknown_field`, `invalid_actor_type`, `metadata_limit_exceeded`,
            `too_many_targets`, `unknown_action`, `schema_validation_failed`, `unknown_organization`, `quota_exceeded`, `rate_limited`,
            `trail_not_allowed`, `payload_too_large`. New codes are additive.'
        message:
          type: string
          description: Human-readable explanation of this particular failure.
        field:
          type: string
          nullable: true
          description: The request field at fault, or null when no single field is.
    EventActor:
      type: object
      description: 'Who acted, in the producer''s own ids.


        Documentation-only on the write path — `apps.audit_trails.ingest` is the

        validator — and the shape `AuditEventSerializer.get_actor` always returns, so

        every key is present on a read even when the producer sent none of them.'
      properties:
        type:
          type: string
          description: 'Actor kind: user, system, agent or anonymous. The relay path stores whatever Ankusa relayed.'
        id:
          type: string
          description: The actor's id in the producer's own namespace; required unless `type` is anonymous.
        name:
          type: string
          description: Human-readable actor name; empty when unknown.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Actor metadata: at most 50 keys, each at most 40 characters of A-Z a-z 0-9 _ . -, each value at most
            500 characters. An agent acting for someone sets on_behalf_of_type and on_behalf_of_id.'
      required:
      - type
    EventActorRequest:
      type: object
      description: 'Who acted, in the producer''s own ids.


        Documentation-only on the write path — `apps.audit_trails.ingest` is the

        validator — and the shape `AuditEventSerializer.get_actor` always returns, so

        every key is present on a read even when the producer sent none of them.'
      properties:
        type:
          type: string
          description: 'Actor kind: user, system, agent or anonymous. The relay path stores whatever Ankusa relayed.'
        id:
          type: string
          description: The actor's id in the producer's own namespace; required unless `type` is anonymous.
        name:
          type: string
          description: Human-readable actor name; empty when unknown.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Actor metadata: at most 50 keys, each at most 40 characters of A-Z a-z 0-9 _ . -, each value at most
            500 characters. An agent acting for someone sets on_behalf_of_type and on_behalf_of_id.'
      required:
      - type
    EventBatchItemResult:
      type: object
      description: 'One batch result item: accepted or duplicate items carry id, rejected items carry error.'
      required:
      - index
      - status
      properties:
        index:
          type: integer
        status:
          type: string
          enum:
          - accepted
          - duplicate
          - rejected
        id:
          type: string
        error:
          $ref: '#/components/schemas/ErrorBody'
    EventBatchRequest:
      type: object
      description: 'Documentation-only shape of a batch ingest request: ``{"events": [...]}``.


        One request may carry at most `MAX_EVENTS_PER_BATCH` envelopes; the whole body

        is capped at 1 MiB.'
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventEnvelopeRequest'
          description: One to 500 envelopes, indexed in order.
      required:
      - events
    EventBatchResult:
      type: object
      description: 'Documentation-only shape of a batch ingest response.


        Mirrors `apps.audit_trails.api_views._batch_response`: one entry per submitted

        event, in submission order, an accepted or duplicate entry carrying the stored

        event''s id and a rejected entry carrying the error envelope instead. The

        response is 202 when nothing was rejected and 207 when anything was.'
      properties:
        accepted:
          type: integer
          description: How many events this request indexed (including idempotent replays).
        rejected:
          type: integer
          description: How many events this request rejected.
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventBatchItemResult'
          description: One result per submitted event, in submission order.
      required:
      - accepted
      - rejected
      - results
    EventDefinition:
      type: object
      properties:
        action:
          type: string
          description: The action name, e.g. invoice.voided.
        description:
          type: string
          description: What this action means, for the people reading the catalog.
        allowed_target_types:
          type: array
          items:
            type: string
          description: Target types an event with this action may name; empty means any target type.
        is_active:
          type: boolean
          description: True while the action is in force. A definition that is not active is treated as undefined when a team
            has any definitions at all.
        created_at:
          type: string
          description: When the action was first defined.
        updated_at:
          type: string
          description: When the definition was last changed.
      required:
      - action
      - allowed_target_types
      - created_at
      - description
      - is_active
      - updated_at
    EventDefinitionWriteRequest:
      type: object
      description: The writable part of a definition, for create and (partially) for update.
      properties:
        action:
          type: string
          description: 'The action name, e.g. invoice.voided: dotted segments of letters, digits, ''-'' and ''_''. Sending
            a new value on an update renames the action; its schema versions go with it.'
        description:
          type: string
          description: What this action means, for the people reading the catalog.
        allowed_target_types:
          type: array
          items:
            type: string
          description: Target types an event with this action may name; empty means any target type.
        is_active:
          type: boolean
          description: True while the action is in force. A definition that is not active is treated as undefined when a team
            has any definitions at all.
      required:
      - action
    EventEnvelopeRequest:
      type: object
      description: 'Documentation-only shape of one producer envelope.


        Never used to validate: `apps.audit_trails.envelope.parse_envelope` is the

        single validator, because it also has to serve the relay path''s lenient

        mode. This class exists so the OpenAPI schema and the generated client show

        producers what to send, in the envelope''s field order.


        The published limits are enforced by ingest, not here: the three metadata maps

        (the event''s, the actor''s and each target''s) hold at most 50 keys, keys are at

        most 40 characters of `A-Z a-z 0-9 _ . -`, values are at most 500 characters,

        and an event names at most 10 targets.'
      properties:
        event:
          type: string
          description: The event type, e.g. invoice.voided.
        trail:
          type: string
          description: The audit log trail to index this event on; the key must be scoped to it.
        created_at:
          type: string
          description: 'RFC 3339 with an offset: when the event happened. Defaults to receipt time; a timestamp without an
            offset is refused.'
        organization_id:
          type: string
          description: The end-customer organization this event belongs to.
        idempotency_key:
          type: string
          description: 'Replay guard, per trail: a repeat of the same key within 24 hours returns the event already stored
            instead of indexing a new one.'
        actor:
          allOf:
          - $ref: '#/components/schemas/EventActorRequest'
          description: Who acted; omit it for an event with no actor.
        targets:
          type: array
          items:
            $ref: '#/components/schemas/EventTargetRequest'
          description: The objects the event acted on; at most 10.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Event metadata: at most 50 keys, each at most 40 characters of A-Z a-z 0-9 _ . -, each value at most
            500 characters.'
        data:
          description: The producer's own payload for the event, stored verbatim and never interpreted.
        context:
          type: object
          additionalProperties: {}
          description: Extra producer context, stored verbatim; `context.actor` and `context.targets` are read as a fallback
            when the top-level members are absent.
        schema_version:
          type: integer
          description: Pin to one published schema version of the action; absent means the newest published, not deprecated
            version. Ingest accepts it; the control plane's documented envelope does not list it yet.
      required:
      - event
      - trail
    EventIngestRequest:
      oneOf:
      - $ref: '#/components/schemas/EventEnvelopeRequest'
      - $ref: '#/components/schemas/EventBatchRequest'
    EventSchemaDocumentRequest:
      type: object
      description: 'A schema document: the body of a draft create or update, and of a dry run.'
      properties:
        schema:
          type: object
          additionalProperties: {}
          description: The whole JSON Schema 2020-12 document, as a JSON object. Every `$ref` must point inside it (`#...`).
      required:
      - schema
    EventSchemaVersion:
      type: object
      properties:
        version:
          type: integer
          description: The per-action version number; never reused, even after a draft is deleted.
        status:
          type: string
          description: 'draft: editable, validates nothing. published: immutable, validates ingest. deprecated: a newer version
            superseded it; pinned producers are accepted until `deprecation_deadline`.


            * `draft` - Draft

            * `published` - Published

            * `deprecated` - Deprecated'
        schema:
          type: object
          additionalProperties: {}
          description: The JSON Schema 2020-12 document. It validates the event's `metadata`, `actor.metadata` and each `targets[].metadata`;
            metadata values are always strings.
        published_at:
          type: string
          nullable: true
          description: When the version was published; null for a draft.
        deprecated_at:
          type: string
          nullable: true
          description: When a newer version superseded this one; null until then.
        deprecation_deadline:
          type: string
          nullable: true
          description: When a deprecated version stops accepting pinned traffic; null while it is not deprecated.
        created_at:
          type: string
          description: When the draft was first created.
        updated_at:
          type: string
          description: When the version last changed. The `ETag` tracks it.
      required:
      - created_at
      - deprecated_at
      - deprecation_deadline
      - published_at
      - schema
      - status
      - updated_at
      - version
    EventTarget:
      type: object
      description: 'One object an event acted on, in the producer''s own ids.


        The shape `AuditEventSerializer.get_targets` returns, and the shape ingest

        accepts on an envelope''s `targets` array.'
      properties:
        type:
          type: string
          description: Target kind, e.g. invoice; ingest requires a non-empty string.
        id:
          type: string
          description: The target's id in the producer's own namespace.
        name:
          type: string
          description: Human-readable target name; empty when unknown.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Target metadata: at most 50 keys, each at most 40 characters of A-Z a-z 0-9 _ . -, each value at most
            500 characters.'
      required:
      - id
      - type
    EventTargetRequest:
      type: object
      description: 'One object an event acted on, in the producer''s own ids.


        The shape `AuditEventSerializer.get_targets` returns, and the shape ingest

        accepts on an envelope''s `targets` array.'
      properties:
        type:
          type: string
          description: Target kind, e.g. invoice; ingest requires a non-empty string.
        id:
          type: string
          description: The target's id in the producer's own namespace.
        name:
          type: string
          description: Human-readable target name; empty when unknown.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Target metadata: at most 50 keys, each at most 40 characters of A-Z a-z 0-9 _ . -, each value at most
            500 characters.'
      required:
      - id
      - type
    OcsfMapping:
      type: object
      properties:
        version:
          type: string
          description: The OCSF release the mapping targets, e.g. 1.9.0.
        class_uid:
          type: integer
          description: The OCSF class the action maps to.
        activity_id:
          type: integer
          description: The class's activity_id enum value; 99 is Other, a best fit rather than exact.
        status_id:
          type: integer
          nullable: true
          description: 'The OCSF status_id the outcome sets: 2 for a failure, null when the action sets none.'
      required:
      - activity_id
      - class_uid
      - status_id
      - version
    PaginatedAuditEventList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          example: https://api.santati.io/api/v0/events/?cursor=cD00ODY%3D
          description: URL of the next page of results, or null on the last page.
        previous:
          type: string
          nullable: true
          example: https://api.santati.io/api/v0/events/?cursor=cj0xJnA9NDg3
          description: URL of the previous page of results, or null on the first page.
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    PaginatedEventDefinitionList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          example: https://api.santati.io/api/v0/event-definitions/?cursor=cD00ODY%3D
          description: URL of the next page of results, or null on the last page.
        previous:
          type: string
          nullable: true
          example: https://api.santati.io/api/v0/event-definitions/?cursor=cj0xJnA9NDg3
          description: URL of the previous page of results, or null on the first page.
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventDefinition'
    PaginatedEventSchemaVersionList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          example: https://api.santati.io/api/v0/event-definitions/invoice.voided/schema-versions/?cursor=cD00ODY%3D
          description: URL of the next page of results, or null on the last page.
        previous:
          type: string
          nullable: true
          example: https://api.santati.io/api/v0/event-definitions/invoice.voided/schema-versions/?cursor=cj0xJnA9NDg3
          description: URL of the previous page of results, or null on the first page.
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventSchemaVersion'
    PatchedEventDefinitionWriteRequest:
      type: object
      description: The writable part of a definition, for create and (partially) for update.
      properties:
        action:
          type: string
          description: 'The action name, e.g. invoice.voided: dotted segments of letters, digits, ''-'' and ''_''. Sending
            a new value on an update renames the action; its schema versions go with it.'
        description:
          type: string
          description: What this action means, for the people reading the catalog.
        allowed_target_types:
          type: array
          items:
            type: string
          description: Target types an event with this action may name; empty means any target type.
        is_active:
          type: boolean
          description: True while the action is in force. A definition that is not active is treated as undefined when a team
            has any definitions at all.
    SchemaCheck:
      type: object
      properties:
        checked:
          type: integer
          description: How many of the newest stored events were run.
        failed:
          type: integer
          description: How many of them the document would reject.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/SchemaCheckFailure'
          description: The first failing events, at most 50.
      required:
      - checked
      - failed
      - failures
    SchemaCheckFailure:
      type: object
      properties:
        event_id:
          type: string
          description: The stored event that fails the document.
        occurred_at:
          type: string
          description: When the event occurred.
        field:
          type: string
          nullable: true
          description: The dotted path of the offending value, or null for the root.
        message:
          type: string
          description: What the document rejected.
      required:
      - event_id
      - field
      - message
      - occurred_at
    StandardEvent:
      type: object
      properties:
        action:
          type: string
          description: The action name, e.g. agent.tool.called.
        description:
          type: string
          description: What the action means.
        target_types:
          type: array
          items:
            type: string
          description: Target types installed as the action's allowed target types; empty means any.
        required_metadata:
          type: array
          items:
            type: string
          description: Metadata keys every event with this action must carry.
        optional_metadata:
          type: array
          items:
            type: string
          description: Metadata keys the schema declares as strings but does not require.
        schema:
          type: object
          additionalProperties: {}
          description: The JSON Schema 2020-12 document installed as the action's published v1.
        ocsf:
          allOf:
          - $ref: '#/components/schemas/OcsfMapping'
          description: The action's OCSF class and activity.
      required:
      - action
      - description
      - ocsf
      - optional_metadata
      - required_metadata
      - schema
      - target_types
    StandardEventCatalog:
      type: object
      properties:
        packs:
          type: array
          items:
            $ref: '#/components/schemas/StandardPack'
          description: Every standard pack.
      required:
      - packs
    StandardPack:
      type: object
      properties:
        slug:
          type: string
          description: Stable identifier of the pack.
        name:
          type: string
          description: Display name of the pack.
        description:
          type: string
          description: What the pack covers.
        events:
          type: array
          items:
            $ref: '#/components/schemas/StandardEvent'
          description: The pack's actions.
      required:
      - description
      - events
      - name
      - slug
    StandardPackInstallRequest:
      type: object
      properties:
        packs:
          type: array
          items:
            type: string
          description: The slugs of the standard packs to install, as listed by the standard catalog.
      required:
      - packs
    StandardPackInstallResult:
      type: object
      properties:
        created:
          type: array
          items:
            type: string
          description: Actions defined now, each with a published v1.
        skipped:
          type: array
          items:
            type: string
          description: Actions the team already defined; they are left untouched.
      required:
      - created
      - skipped
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: '`Authorization: Api-Key <key>`. `/api/v0/` operations take a team API key; `/teams/` and `/a/{team_slug}/`
        operations take a user API key.'
servers:
- url: https://api.santati.io
  description: Production
- url: http://localhost:8000
  description: Local development
tags:
- name: audit-events
  x-displayName: Audit events
  description: Send audit events to a trail and search the events a team has recorded.
- name: audit-trails
  x-displayName: Audit trails
  description: Create, list and delete the trails that audit events are sent to.
- name: chain
  x-displayName: Chain verification
  description: Verify a trail's tamper-evident hash chain and download the verification report.
- name: event-definitions
  x-displayName: Event definitions
  description: The event actions defined in a team's schema catalog, their JSON Schema versions, and the standard packs that
    seed them.
- name: exports
  x-displayName: Exports
  description: Export matching audit events to a CSV or JSON Lines file.
